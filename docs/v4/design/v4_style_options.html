<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>v4 시험 화면 시안</title>
<style>
/* Layout: neutral comparison chrome on top (style A-E, screen 1-5, test, theme), the chosen style renders full width beneath it as its own world. */
:root{
  --c-bg:#eeeeeb; --c-surface:#fafaf8; --c-ink:#1b1b1d; --c-ink2:#55555c; --c-line:#d4d4cf; --c-sel:#1b1b1d; --c-selink:#fafaf8; --c-focus:#2f6fdb; --c-tipbg:#1b1b1d; --c-tipink:#fafaf8;
  --f-sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --f-serif:"Noto Serif KR","Noto Serif CJK KR","AppleMyungjo","Batang","NanumMyeongjo",serif;
  --f-mono:"D2Coding","JetBrains Mono","Consolas","NanumGothicCoding","Noto Sans Mono CJK KR",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-bg:#141416;--c-surface:#1c1c1f;--c-ink:#ececee;--c-ink2:#a4a4ab;--c-line:#303035;--c-sel:#ececee;--c-selink:#141416;--c-focus:#7ea6ff;--c-tipbg:#ececee;--c-tipink:#141416;color-scheme:dark}}
:root[data-theme="dark"]{--c-bg:#141416;--c-surface:#1c1c1f;--c-ink:#ececee;--c-ink2:#a4a4ab;--c-line:#303035;--c-sel:#ececee;--c-selink:#141416;--c-focus:#7ea6ff;--c-tipbg:#ececee;--c-tipink:#141416;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font:14px/1.5 var(--f-sans)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.chrome{background:var(--c-surface);border-bottom:1px solid var(--c-line);padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
@media (min-width:1100px){.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:40}}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:6px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--c-ink2)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ctl-lab{font-size:12px;color:var(--c-ink2);letter-spacing:.02em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--c-line);background:transparent;border-radius:7px;padding:5px 10px;min-height:32px;font-size:13px;color:var(--c-ink);display:inline-flex;align-items:center;gap:6px}
.seg button:hover{border-color:var(--c-ink2)}
.seg button[aria-pressed="true"]{background:var(--c-sel);color:var(--c-selink);border-color:var(--c-sel);font-weight:600}
.seg button .k{font-weight:700}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.chrome .spacer{flex:1}
.scard{padding-inline:16px;padding-block:12px;display:grid;grid-template-columns:minmax(170px,210px) repeat(4,minmax(0,1fr));gap:10px 22px;border-bottom:1px solid var(--c-line);background:var(--c-bg);font-size:13px}
.scard{display:block}
.scard summary{cursor:pointer;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;list-style:none}
.scard summary::-webkit-details-marker{display:none}
.scard summary .hint{font-size:12px;color:var(--c-ink2);text-decoration:underline}
.scard-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 22px;margin-top:8px}
.scard h2{margin:0;font-size:16px;line-height:1.3;display:inline}
.scard h2 small{font-size:12.5px;font-weight:500;color:var(--c-ink2);margin-left:8px}
.scard dl{margin:0}
.scard dt{font-size:11.5px;color:var(--c-ink2);letter-spacing:.04em;margin-bottom:2px}
.scard dd{margin:0;line-height:1.5}
.meter{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:6px}
.meter i{width:9px;height:9px;border:1px solid var(--c-ink);border-radius:2px}
.meter i.f{background:var(--c-ink)}
@media (max-width:1100px){.scard-body{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.scard-body{grid-template-columns:1fr}}
.stage{container-type:inline-size;container-name:stage;min-width:0}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--c-tipbg);color:var(--c-tipink);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--c-tipbg);color:var(--c-tipink);padding:6px 9px;border-radius:6px;font-size:12px;line-height:1.4;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- compare view ---------- */
.cmp-wrap{padding-inline:16px;padding-block:16px}
.cmp-bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:12px}
.cmp-bar h2{margin:0;font-size:16px}
.cmp{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:14px}
@media (max-width:1100px){.cmp{--cols:2!important}}
@media (max-width:640px){.cmp{--cols:1!important}}
.cmp-card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.cmp-card:hover{border-color:var(--c-ink2)}
.cmp-card.cur{outline:2px solid var(--c-sel);outline-offset:1px}
.cmp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--c-line)}
.cmp-head button{border:1px solid var(--c-line);background:transparent;border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:600;color:var(--c-ink)}
.cmp-head span{font-size:12px;color:var(--c-ink2)}
.cmp-frame{position:relative;overflow:hidden;height:300px}
.cmp-inner{position:absolute;left:0;top:0;width:1280px;transform-origin:0 0;pointer-events:none;container-type:inline-size;container-name:stage}
.cmp-inner>.sroot{min-height:1500px}
@media (max-width:1100px){.cmp-cols{display:none!important}}

/* ---------- shared per-key F1 chart (each style sets --f1-* tokens) ---------- */
.f1c{--lw:150px;--vw:58px;--g:10px;container-type:inline-size;container-name:f1c;position:relative;display:flex;flex-direction:column;gap:5px;padding-top:20px}
.f1c-row,.f1c-axis{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--vw);gap:var(--g);align-items:center;min-height:22px}
.f1c-row{border-radius:3px}
.f1c-row:focus-visible{outline-offset:1px}
.f1c-lab{font-size:12.5px;color:var(--f1-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f1c-track{position:relative;height:var(--bh,14px);background:var(--f1-track)}
.f1c-bar{position:absolute;left:0;top:0;bottom:0;background:var(--f1-bar);border-radius:0 4px 4px 0}
.f1c-row:hover .f1c-bar,.f1c-row:focus-visible .f1c-bar{filter:brightness(1.15) saturate(1.1)}
.f1c-val{font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;color:var(--f1-ink)}
.f1c-row.na .f1c-val{color:var(--f1-ink2)}
.f1c-row.na .f1c-track{background:transparent;border-top:1px dashed var(--f1-axis);height:0}
.f1c-ref{position:absolute;top:2px;bottom:20px;width:0;left:calc(var(--lw) + var(--g) + (100% - var(--lw) - var(--vw) - 2 * var(--g)) * .85);border-left:1.5px solid var(--f1-ref);pointer-events:none;z-index:1}
.f1c-ref span{position:absolute;top:-2px;right:6px;font-size:11px;color:var(--f1-ink2);white-space:nowrap}
.f1c-ticks{position:relative;height:18px;border-top:1px solid var(--f1-axis)}
.f1c-ticks i{position:absolute;top:2px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--f1-ink2);font-variant-numeric:tabular-nums}
.f1c-ticks i:first-child{transform:none}
.f1c-ticks i:last-child{transform:translateX(-100%)}
@container stage (max-width:560px){.f1c{--lw:112px;--vw:50px;--g:8px}}
@container f1c (max-width:430px){.f1c-ticks i:nth-child(2),.f1c-ticks i:nth-child(4){display:none}}

/* =====================================================================
   STYLE A — 연속성 (v2 계승): navy sidebar stepper, indigo→violet gradient, rounded white cards
   ===================================================================== */
.sA{--a-bg:#f8fafc;--a-card:#ffffff;--a-text:#1e293b;--a-muted:#64748b;--a-light:#8a99ad;--a-border:#e2e8f0;--a-navy:#0f172a;--a-navy3:#334155;--a-side-ink:#f1f5f9;--a-side-muted:#94a3b8;--a-from:#6366f1;--a-to:#8b5cf6;--a-accent:#6d28d9;--a-ok:#10b981;--a-oktext:#047857;--a-bad:#ef4444;--a-badtext:#b91c1c;--a-warntext:#b45309;--a-infotext:#1d4ed8;--a-tint:rgba(99,102,241,.07);--a-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);--a-logbg:#0f172a;--a-logink:#a5f3fc;--a-logdim:#94a3b8;--a-logok:#6ee7b7;--a-logwarn:#fcd34d;--a-onacc:#ffffff;
  --f1-bar:#6366f1;--f1-track:#eef0f6;--f1-ink:#1e293b;--f1-ink2:#64748b;--f1-ref:#1e293b;--f1-axis:#cbd5e1;
  background:var(--a-bg);color:var(--a-text);font-family:var(--f-sans);font-size:15px;line-height:1.5;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:900px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sA{--a-bg:#0b1020;--a-card:#131b2e;--a-text:#e2e8f0;--a-muted:#9aa8bd;--a-light:#7f8da3;--a-border:#26314a;--a-navy:#060a14;--a-navy3:#2a3650;--a-accent:#b4a2fb;--a-oktext:#34d399;--a-badtext:#f87171;--a-warntext:#fbbf24;--a-infotext:#93c5fd;--a-tint:rgba(129,140,248,.12);--a-shadow:0 1px 3px rgba(0,0,0,.45);--a-logbg:#060a14;--f1-bar:#747cf0;--f1-track:#1b2438;--f1-ink:#e2e8f0;--f1-ink2:#9aa8bd;--f1-ref:#e2e8f0;--f1-axis:#334155}}
:root[data-theme="dark"] .sA{--a-bg:#0b1020;--a-card:#131b2e;--a-text:#e2e8f0;--a-muted:#9aa8bd;--a-light:#7f8da3;--a-border:#26314a;--a-navy:#060a14;--a-navy3:#2a3650;--a-accent:#b4a2fb;--a-oktext:#34d399;--a-badtext:#f87171;--a-warntext:#fbbf24;--a-infotext:#93c5fd;--a-tint:rgba(129,140,248,.12);--a-shadow:0 1px 3px rgba(0,0,0,.45);--a-logbg:#060a14;--f1-bar:#747cf0;--f1-track:#1b2438;--f1-ink:#e2e8f0;--f1-ink2:#9aa8bd;--f1-ref:#e2e8f0;--f1-axis:#334155}
.a-side{background:var(--a-navy);color:var(--a-side-ink);display:flex;flex-direction:column;min-width:0}
.a-side-head{padding:26px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.a-logo{display:flex;align-items:center;gap:12px}
.a-logo-ic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--a-from),var(--a-to));display:grid;place-items:center;color:var(--a-onacc);flex-shrink:0}
.a-logo-t{font-weight:700;font-size:15px;color:var(--a-side-ink)}
.a-logo-s{font-size:13px;color:var(--a-side-muted);margin-top:2px}
.a-stepper{padding:22px 14px;flex:1}
.a-step-lab{color:var(--a-side-muted);font-size:12px;font-weight:600;letter-spacing:1.2px;margin:0 0 12px 8px}
.a-step{display:flex;align-items:flex-start;gap:14px;padding:11px 8px;border-radius:10px;width:100%;text-align:left;background:transparent;border:0;color:inherit;position:relative;margin-bottom:2px}
.a-step:hover{background:rgba(255,255,255,.05)}
.a-step[aria-current="page"]{background:rgba(99,102,241,.18)}
.a-step-num{width:32px;height:32px;border-radius:10px;border:2px solid var(--a-navy3);display:grid;place-items:center;color:var(--a-side-muted);flex-shrink:0}
.a-step[aria-current="page"] .a-step-num{background:linear-gradient(135deg,var(--a-from),var(--a-to));border-color:var(--a-from);color:var(--a-onacc);box-shadow:0 0 16px rgba(99,102,241,.45)}
.a-step.done .a-step-num{background:var(--a-ok);border-color:var(--a-ok);color:var(--a-onacc)}
.a-step-t{display:block;font-weight:600;color:#cbd5e1;font-size:15px;padding-top:4px}
.a-step[aria-current="page"] .a-step-t{color:#fff}
.a-step-d{display:block;font-size:13px;color:rgba(148,163,184,.8);margin-top:1px}
.a-step:not(:last-child)::after{content:"";position:absolute;left:23px;top:45px;width:2px;height:13px;background:var(--a-navy3)}
.a-side-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:var(--a-side-muted);line-height:1.65}
.a-main{padding:32px 40px 48px;min-width:0}
.a-hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.a-h1{font-size:24px;font-weight:700;margin:0;text-wrap:balance}
.a-sub{color:var(--a-muted);font-size:15px;margin-top:4px}
.a-card{background:var(--a-card);border:1px solid var(--a-border);border-radius:16px;box-shadow:var(--a-shadow);padding:24px 28px;margin-top:20px;min-width:0}
.a-card-t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin:0 0 16px}
.a-card-t svg{color:var(--a-accent)}
.a-pills{display:flex;gap:8px;flex-wrap:wrap}
.a-pill{padding:10px 20px 10px 14px;border:2px solid var(--a-border);border-radius:12px;background:var(--a-card);font-weight:500;display:flex;gap:10px;align-items:center;position:relative;text-align:left;color:var(--a-text)}
.a-pill:hover{border-color:var(--a-from)}
.a-pill small{display:block;font-size:12.5px;color:var(--a-muted);font-weight:500}
.a-pill[aria-pressed="true"]{border-color:var(--a-from);background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.08));color:var(--a-accent);font-weight:700}
.a-pill[aria-pressed="true"]::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--a-ok)}
.a-pill-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--a-tint);color:var(--a-accent);flex-shrink:0}
.a-drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.a-drop{border:2px dashed var(--a-border);border-radius:16px;padding:26px 18px;text-align:center;background:linear-gradient(135deg,rgba(99,102,241,.025),rgba(139,92,246,.025));min-width:0}
.a-drop-ic{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,var(--a-from),var(--a-to));display:grid;place-items:center;color:var(--a-onacc)}
.a-drop-t{font-weight:600}
.a-drop-d{color:var(--a-muted);font-size:14px;margin:4px 0 14px}
.a-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--a-from),var(--a-to));color:var(--a-onacc);font-weight:600;font-size:15px}
.a-btn:hover{box-shadow:0 4px 16px rgba(99,102,241,.4)}
.a-btn.ghost{background:var(--a-card);color:var(--a-text);border:1px solid var(--a-border)}
.a-btn.danger{background:var(--a-card);color:var(--a-badtext);border:1px solid var(--a-bad)}
.a-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.a-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.a-badge{padding:3px 9px;background:rgba(99,102,241,.09);color:var(--a-accent);border-radius:6px;font-size:13px;font-weight:600}
.a-file{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--a-tint);border:1px solid rgba(99,102,241,.2);border-radius:10px;margin-top:12px;text-align:left;font-size:14px;min-width:0}
.a-file span{min-width:0;overflow-wrap:anywhere}
.a-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.a-lab{font-size:13px;font-weight:600;color:var(--a-muted);letter-spacing:.3px;display:block;margin-bottom:8px}
.a-sel{width:100%;padding:10px 14px;border:2px solid var(--a-border);border-radius:10px;background:var(--a-card);color:var(--a-text);font-size:15px}
.a-sel:focus{border-color:var(--a-from);outline:none}
.a-cta{width:100%;padding:16px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--a-from),var(--a-to));color:var(--a-onacc);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px}
.a-cta:hover{box-shadow:0 8px 28px rgba(99,102,241,.4)}
.a-cta:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.a-note{font-size:13px;color:var(--a-muted);margin-top:10px}
.a-pipe{display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;row-gap:14px;padding:10px 0 4px}
.a-node{display:flex;flex-direction:column;align-items:center;gap:7px;opacity:.38;width:112px;text-align:center}
.a-node.on,.a-node.done,.a-node.skip{opacity:1}
.a-node-c{width:52px;height:52px;border-radius:16px;border:2px solid var(--a-border);display:grid;place-items:center;background:var(--a-card);color:var(--a-muted);position:relative}
.a-node.on .a-node-c{border-color:var(--a-from);box-shadow:0 0 24px rgba(99,102,241,.4);color:var(--a-accent)}
.a-node.on .a-node-c::after{content:"";position:absolute;inset:-6px;border-radius:20px;border:2px solid var(--a-from);animation:aPulse 1.5s ease infinite}
@keyframes aPulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.a-node.done .a-node-c{background:var(--a-ok);border-color:var(--a-ok);color:var(--a-onacc)}
.a-node.skip .a-node-c{border-style:dashed}
.a-node-l{font-weight:600;font-size:14px;color:var(--a-muted)}
.a-node.done .a-node-l{color:var(--a-oktext)}
.a-node.on .a-node-l{color:var(--a-accent)}
.a-node-x{font-size:12px;color:var(--a-muted);line-height:1.35}
.a-conn{width:28px;height:2px;background:var(--a-border);margin-top:26px;flex-shrink:0}
.a-conn.done{background:var(--a-ok)}
.a-sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.a-sum{border:1px solid var(--a-border);border-radius:10px;padding:14px 12px;text-align:center;background:var(--a-card)}
.a-sum-v{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--a-from),var(--a-to));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.a-sum-v.ok{background:none;color:var(--a-oktext)}
.a-sum-v.bad{background:none;color:var(--a-badtext)}
.a-sum-l{font-size:13px;color:var(--a-muted);margin-top:2px}
.a-tabs{display:flex;gap:2px;background:var(--a-bg);border-radius:10px;padding:3px;margin:20px 0 6px}
.a-tab{flex:1;padding:9px 14px;border:0;background:transparent;border-radius:8px;color:var(--a-muted);font-size:15px}
.a-tab[aria-pressed="true"]{background:var(--a-card);color:var(--a-accent);font-weight:600;box-shadow:var(--a-shadow)}
.a-grp{margin-top:18px}
.a-grp-t{font-weight:700;font-size:15px;padding:9px 14px;background:linear-gradient(90deg,rgba(99,102,241,.08),transparent);border-left:3px solid var(--a-accent);border-radius:0 10px 10px 0;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}

    return {K,v,code,label,detail,cos:v?v.cos:null,tau:v?v.tau:null,tok:v?v.tok:null,gold:v?v.gold:null,kind:v?v.kind:null};
  });
}
const vShort = c => ({TP:'TP',PART:'부분',MISS:'불일치',ERR:'오답',FP:'FP',FN:'FN',NA:'–'}[c]);
const vText = x => ({TP:'TP',PART:'부분 일치',MISS:'불일치',ERR:'오답 (FP+FN)',FP:'FP',FN:'FN',NA:'해당 없음'}[x.code]);
function setScore(test,set){ const vs=verdicts(test,set).filter(x=>x.code!=='NA'); return {ok:vs.filter(x=>x.code==='TP').length,n:vs.length}; }
const gtxt = g => g==null ? '—' : Array.isArray(g) ? g.join(', ') : typeof g==='number' ? g.toLocaleString('ko-KR') : String(g);
function keyMetrics(test){ const D=DATA[test]; return KEYS.filter(K=>K.test===test).map(K=>({K,m:D.keys[K.k]||null,excluded:D.excluded.some(e=>e.key===K.k)||!D.keys[K.k]||D.keys[K.k].f1==null})); }
function drillSet(test){ const id=S.drill[test]; return id ? sets(test).find(s=>s.id===id) : null; }

/* ---------- shared chart ---------- */
function f1Chart(test){
  const rows=keyMetrics(test);
  return `<div class="f1c" role="list" aria-label="${test} 항목별 F1, 합격선 85%">
   <div class="f1c-ref" aria-hidden="true"><span>합격선 85%</span></div>
   ${rows.map(r=>{ const lab=`${r.K.no} ${esc(r.K.label)}`;
     if(r.excluded) return `<div class="f1c-row na" role="listitem" aria-label="${esc(r.K.label)} 채점 제외"><span class="f1c-lab">${lab}</span><span class="f1c-track"></span><span class="f1c-val">제외</span></div>`;
     const m=r.m; const tipL=`${r.K.label} · 정밀도 ${pct(m.precision)} · 재현율 ${pct(m.recall)} · TP ${m.tp} · FP ${m.fp} · FN ${m.fn} · 평가 ${m.n_scored}건`;
     return `<div class="f1c-row" role="listitem" tabindex="0" data-tipv="F1 ${pct(m.f1)}" data-tipl="${esc(tipL)}" aria-label="${esc(r.K.label)} F1 ${pct(m.f1)}"><span class="f1c-lab">${lab}</span><span class="f1c-track"><span class="f1c-bar" style="width:${(m.f1*100).toFixed(2)}%"></span></span><span class="f1c-val">${pct(m.f1)}</span></div>`; }).join('')}
   <div class="f1c-axis" aria-hidden="true"><span></span><span class="f1c-ticks"><i style="left:0">0</i><i style="left:25%">25</i><i style="left:50%">50</i><i style="left:75%">75</i><i style="left:100%">100%</i></span><span></span></div>
  </div>`;
}

/* ---------- batch settings & estimate ---------- */
function setSource(src){ const s=SOURCES[src]; const b=S.batch; b.source=src; b.cells=Object.keys(s.cells); b.n=Object.values(s.cells).reduce((a,x)=>a+x,0); if(s.gold) b.gold=s.gold; if(s.test==='T-001') b.consWork=false; b.workers=s.test==='T-002'&&src!=='t001_5'?6:3; S.test=s.test; }
function est(){
  const b=S.batch, src=SOURCES[b.source]; const sel=Object.entries(src.cells).filter(([c])=>b.cells.includes(c));
  const tot=sel.reduce((a,[,n])=>a+n,0); const n=Math.max(0,Math.min(+b.n||0,tot)); const fr=tot?n/tot:0;
  let img=0,vid=0,txt=0; sel.forEach(([c,k])=>{ const m=c.split('/')[0], x=k*fr; if(m==='image') img+=x; else if(m==='video') vid+=x; else txt+=x; });
  let cost,per,basis;
  if(src.test==='T-001'){ cost=n*44.8; per=87.2; basis='개발 실행 평균: 계약서당 87.2 s, ₩44.8'; }
  else { cost=img*0.2+vid*2.0; per=24.3; basis='진행 문서 예상치: 세트당 24.3 s(작업자 1명), 영상 ₩2.0, 이미지 ₩0.2'; }
  const w=Math.max(1,Math.min(8,+b.workers||1));
  return {n,tot,img:Math.round(img),vid:Math.round(vid),txt:Math.round(txt),cost,per,time:n*per/w,basis,openrouter:src.test==='T-002'&&img>0,blocked:!!src.blocked,src};
}

/* ---------- batch run simulation (replays the real test.log timeline) ---------- */
const TLC = {};
function parseTs(l){ const m=l.match(/(\d\d):(\d\d):(\d\d),(\d+)/); return m ? (+m[1])*3600+(+m[2])*60+(+m[3])+(+m[4])/1000 : 0; }
function timeline(test){
  if(TLC[test]) return TLC[test];
  const lines=DATA[test].log, t0=parseTs(lines[0]); const L=lines.map(l=>({t:parseTs(l)-t0,text:l})); const sx={}, order=[]; let batchEnd=null;
  L.forEach(x=>{ let m=x.text.match(/\[(\d+)\] 시작/); if(m){ sx[m[1]]={start:x.t}; order.push(m[1]); }
    m=x.text.match(/\[(\d+)\] 종료 — (\w+) · ([\d.]+)s.*₩([\d.]+)/); if(m) Object.assign(sx[m[1]],{end:x.t,ok:m[2]==='OK',el:+m[3],cost:+m[4]});
    if(/배치 종료/.test(x.text)) batchEnd=x.t; });
  return TLC[test]={L,sets:sx,order,end:L[L.length-1].t,batchEnd,t0};
}
function clock(tl,t){ let s=tl.t0+t; const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); s-=m*60; const p=n=>String(n).padStart(2,'0'); return `2026-10-10 ${p(h)}:${p(m)}:${p(Math.floor(s))},${String(Math.round((s%1)*1000)).padStart(3,'0').slice(0,3)}`; }
function simView(){
  const running=S.sim.status==='running'; const test=running?S.sim.test:S.test; const tl=timeline(test);
  const sim=S.sim.test===test&&S.sim.t!=null ? S.sim : {test,status:'done',t:tl.end};
  const t=sim.status==='cancelled'?sim.at:sim.t;
  const rows=tl.order.map(id=>{ const e=tl.sets[id], set=sets(test).find(s=>s.id===id); let st,el=null,cost=null;
    if(t<e.start) st=sim.status==='cancelled'?'cancel':'wait';
    else if(e.end==null||t<e.end){ st=sim.status==='cancelled'?'cancel':'run'; el=t-e.start; }
    else { st=e.ok?'ok':'bad'; el=e.el; cost=e.cost; }
    return {id,set,st,el,cost}; });
  const done=rows.filter(r=>r.st==='ok'||r.st==='bad').length, cost=rows.reduce((a,r)=>a+(r.cost||0),0);
  const lines=tl.L.filter(x=>x.t<=t+1e-9).map(x=>x.text);
  if(sim.status==='cancelled') lines.push(`${clock(tl,t)} WARN 사용자 취소 — 완료 ${done} · 취소 ${rows.length-done} (시뮬레이션)`);
  const phase=sim.status==='cancelled'?'취소됨':t>=tl.end?'완료':(tl.batchEnd!=null&&t>=tl.batchEnd)?'채점 중':'실행 중';
  const D=DATA[test];
  return {test,sim,rows,done,total:rows.length,cost,lines,t,pct:rows.length?done/rows.length:0,phase,status:sim.status,running:sim.status==='running',
    listLabel:test==='T-001'?'T-001 잠정 5건':'T-002 개발 실행 3건',scored:t>=tl.end&&sim.status!=='cancelled',macro:D.macro.f1,micro:D.micro.f1,passed:D.passed};
}
const stKo = s => ({wait:'대기',run:'실행 중',ok:'완료',bad:'실패',cancel:'취소됨'}[s]);
function logHTML(lines){ return lines.map(l=>{ const m=l.match(/^(\S+ \S+) (INFO|WARN|ERROR) (.*)$/); if(!m) return esc(l);
  const msg=esc(m[3]).replace(/\[(\d+)\]/g,'<span class="id">[$1]</span>'); return `<span class="ts">${esc(m[1].slice(11))}</span> <span class="${m[2]==='INFO'?'lv':'wv'}">${m[2]}</span> ${msg}`; }).join('\n'); }

/* ---------- downloads ---------- */
function fileContent(name,test){
  const D=DATA[test];
  if(name==='test_predictions.jsonl') return D.sets.map(s=>JSON.stringify(predRecord(s,false))).join('\n')+'\n';
  if(name==='test_metrics.json') return JSON.stringify({test,n_sets:D.n_sets,macro_f1:D.macro.f1,micro_f1:D.micro.f1,macro:Object.assign({},D.macro,{ci95_f1:D.macro_ci}),micro:Object.assign({},D.micro,{ci95_f1:D.micro_ci}),pass_mark:D.pass_mark,passed:D.passed,settings:{tau:D.tau,only_predicted:true},excluded_keys:D.excluded,keys:D.keys,cells:D.cells,by_kind:D.by_kind,_note:'시안용 요약본 (실제 test_metrics.json 에서 발췌)'},null,1);
  if(name==='report.md') return D.report;
  if(name==='test.log') return D.log.join('\n')+'\n';
  return '';
}
function download(name,text,type){
  try{ const url=URL.createObjectURL(new Blob([text],{type:type||'application/octet-stream'})); const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},800); toast(name+' 파일을 내려받았습니다'); }
  catch(e){ toast('내려받기를 시작하지 못했습니다. 파일로 연 페이지에서 다시 시도하세요'); }
}
const DL_FILES = ['test_predictions.jsonl','test_metrics.json','report.md','test.log'];
const DL_TYPES = {'test_predictions.jsonl':'application/x-ndjson','test_metrics.json':'application/json','report.md':'text/markdown','test.log':'text/plain'};
let toastT=null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2600); }
</script>

<script>

function goldSelect(p,cls){ const src=SOURCES[S.batch.source];

const estNote = e => `${e.basis}${e.openrouter?' · 이미지 VLM(OpenRouter) 비용은 미계량이라 빠져 있습니다':''}${S.batch.consWork?' · 저작물 통합을 켜면 비용과 시간이 늘어나며 아직 측정하지 않았습니다':''}`;

/* ================= STYLE A ================= */
R.A=(sc,p)=>`<nav class="a-side" aria-label="화면">

 <div class="a-stepper"><div class="a-step-lab">시험 단계</div>${SCREENS.map(s=>`<button type="button" class="a-step" id="${p}nav${s.n}" data-act="screen" data-v="${s.n}"${s.n===sc?' aria-current="page"':''}><span class="a-step-num">${ic(s.icon,16)}</span><span><span class="a-step-t">${s.label}</span><span class="a-step-d">${s.desc}</span></span></button>`).join('')}</div>
 <div class="a-side-foot">주관: 무하유<br>참여: HM컴퍼니 · 숭실대 산학협력단<br>수요: 한국문화정보원 · 한국저작권위원회</div>
</nav><div class="a-main">${A[sc](p)}</div>`;
const aHead=(t,sub,right='')=>`<div class="a-hd"><div><h1 class="a-h1">${t}</h1><div class="a-sub">${sub}</div></div>${right}</div>`;
const aSum=(v,l,cls='')=>`<div class="a-sum"><div class="a-sum-v ${cls}">${v}</div><div class="a-sum-l">${l}</div></div>`;
function aTestPills(p){ return `<div class="a-pills" role="group" aria-label="시험 종류">${[['T-001','계약서 → 항목 1~16 채점','doc'],['T-002','저작물 + 계약서 힌트 → 항목 17~23 채점','image']].map(([t,d,i])=>`<button type="button" class="a-pill" id="${p}tp${t}" data-act="test" data-v="${t}" aria-pressed="${S.test===t}"><span class="a-pill-ic">${ic(i,16)}</span><span>${t}<small>${d}</small></span></button>`).join('')}</div>`; }
A[1]=p=>{ const test=S.test,set=curSet(),rows=rowsOf(test,set),c=counts(rows),steps=stepInfo(test,set),run=S.single.phase==='running';

 const cur=S.single.phase==='done'?steps.length-1:Math.min(S.single.step,steps.length-1);
 const nodes=steps.map((s,i)=>{ const st=stepState(i,test), prev=i?stepState(i-1,test):''; return (i?`<div class="a-conn${prev==='done'||prev==='skip'?' done':''}"></div>`:'')+`<div class="a-node ${st}"><div class="a-node-c">${st==='done'?ic('check',22):ic(['upload','doc','flow','list','check'][i],22)}</div><div class="a-node-l">${s.l}</div><div class="a-node-x">${st==='skip'?'생략':st==='wait'?'대기':esc(s.x)}</div></div>`; }).join('');
 const groups=grouped(rows).map(g=>{ const n=g.rows.filter(r=>r.scored).length; return `<div class="a-grp"><div class="a-grp-t">${g.g}<small>${n?`채점 ${n}개`:'채점 제외'}</small></div><div class="a-pairs">${g.rows.map(r=>`<div class="a-pair${r.scored?'':' off'}"><div class="a-key">${r.no}. ${esc(r.label)} ${r.scored?'<span class="a-x sc">채점</span>':'<span class="a-x un">채점 제외</span>'}${r.src?` <span class="a-x ${r.src==='규칙'?'rule':'model'}" title="${esc(r.srcNote)}">${r.src}</span>`:''}</div>${vh(r,A_V)}</div>`).join('')}</div></div>`; }).join('');
 return aHead('시험 모드','세트 1건을 올려 23개 항목을 추출합니다. 정답 대조는 일괄 시험에서 합니다')+
 `<section class="a-card"><h2 class="a-card-t">${ic('list',18)} 시험 종류</h2>${aTestPills(p)}</section>
 <section class="a-card"><h2 class="a-card-t">${ic('upload',18)} 파일 업로드</h2>
  <div class="a-drops">${test==='T-001'?drop('contract','계약서 PDF','필수 · 텍스트 레이어가 있으면 OCR 생략',['PDF'],'.pdf'):drop('work','저작물 파일','필수 · 이미지, 영상, PPTX(첫 장)',['JPG','PNG','MP4','PPTX'],'image/*,video/*,.pptx')+drop('contract','계약서 PDF (선택)','제목과 종별만 VLM에 힌트로 전달',['PDF'],'.pdf')}</div>
  <div style="margin-top:18px"><label class="a-lab" for="${p}set">예시 세트</label><select class="a-sel" id="${p}set" data-bind="set">${setOptions(test)}</select></div>
  <p class="a-note">오프라인 시안입니다. 실제 추출 대신 2026-10-10 개발 실행 결과를 보여 줍니다.</p>

 <section class="a-card"><h2 class="a-card-t">${ic('flow',18)} 처리 단계</h2><div class="a-pipe">${nodes}</div><p class="a-note" style="text-align:center">${esc(steps[cur].l)} · ${esc(steps[cur].d)}</p></section>
 ${S.single.phase!=='done'?`<section class="a-card"><p class="a-note">추출이 끝나면 23개 항목이 여기에 표시됩니다.</p></section>`:
 `<section class="a-card"><h2 class="a-card-t">${ic('check',18)} 추출 결과 · ${esc(set.title)}</h2>
  <div class="a-sums">${aSum(c.scored+'개','채점 항목')}${aSum(c.filled+' / '+c.scored,'값 있음','ok')}${aSum(c.nulls,'NULL')}${aSum(c.na,'해당 없음')}${aSum(secs(set.elapsed),'처리 시간')}${aSum(won(set.cost),'추정 비용')}</div>
  <div class="a-tabs" role="group" aria-label="결과 보기"><button type="button" class="a-tab" id="${p}atkv" data-act="atab" data-v="kv" aria-pressed="${S.aTab==='kv'}">23개 항목</button><button type="button" class="a-tab" id="${p}atjs" data-act="atab" data-v="json" aria-pressed="${S.aTab==='json'}">JSON</button></div>

A[2]=p=>{ const b=S.batch,e=est(),src=e.src;
 return aHead('일괄 시험 설정','고정 목록에서 세트를 고르고 실행 조건을 정합니다')+

 <section class="c-panel c-s12"><div class="c-ph">SET × KEY VERDICT MATRIX<span>TP 일치 · 부분 = 태그 일부 일치 · 불일치 = 일치 태그 0 · – = 해당 없음</span></div><div class="c-pb c-tw"><table class="c-t" style="min-width:${ks.length>10?780:560}px"><thead><tr><th>SET</th><th>CELL</th><th class="n">MATCH</th><th>KEY ${ks[0].no}–${ks[ks.length-1].no}</th><th></th></tr></thead><tbody>${sets(test).map(s=>{const sc=setScore(test,s),o=open===s.id;return `<tr class="click${o?' open':''}" data-act="drill" data-v="${s.id}"><td class="mono">${s.id}</td><td class="mono">${s.cell}</td><td class="n">${sc.ok}/${sc.n}</td><td>${mx(s)}</td><td><button type="button" class="c-btn" id="${p}dr${s.id}" data-act="drill" data-v="${s.id}" aria-expanded="${o}">${o?'▾':'▸'} 상세</button></td></tr>${o?`<tr data-drill="${s.id}"><td colspan="5"><table class="c-t"><thead><tr><th class="n">#</th><th>KEY</th><th>VERDICT</th><th>PRED</th><th>GOLD</th><th>NOTE</th></tr></thead><tbody>${verdicts(test,s).map(x=>`<tr><td class="n">${x.K.no}</td><td class="k">${x.K.k}</td><td style="white-space:nowrap"><span class="c-led ${({TP:'ok',PART:'warn',MISS:'err',ERR:'err',FP:'err',FN:'err',NA:'off'})[x.code]}" aria-hidden="true"></span>${vText(x)}</td><td>${cPred(s,x.K.k)}</td><td>${x.code==='NA'?'—':esc(gtxt(x.gold))}</td><td class="mono">${x.cos!=null?`cos ${x.cos.toFixed(3)} ${x.cos>=x.tau?'≥':'<'} τ ${x.tau}`:x.detail?esc(x.label+' · '+x.detail):''}</td></tr>`).join('')}</tbody></table></td></tr>`:''}`;}).join('')}</tbody></table></div></section>

const dKpi=(lab,val,sub='',cls='')=>`<div class="d-card d-kpi ${cls}"><div class="lab">${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
function dV(x){ return `<div class="d-v"><div class="k"><span>${x.K.no}. ${esc(x.K.label)}</span><span class="d-chip ${({TP:'good',PART:'warn',MISS:'bad',ERR:'bad',FP:'bad',FN:'bad',NA:'mut'})[x.code]}">${vText(x)}</span></div>${x.detail?`<div class="d">${esc(x.label)} · ${x.detail}</div>`:''}${x.cos!=null?`<div class="d">KURE-v1 cos ${x.cos.toFixed(3)} ${x.cos>=x.tau?'≥':'<'} τ ${x.tau}</div><div class="d-cos" aria-hidden="true"><i style="width:${(x.cos*100).toFixed(1)}%"></i><u style="left:${x.tau*100}%"></u></div>`:''}${x.code!=='NA'&&x.cos==null&&!x.detail?`<div class="d">정답 ${esc(gtxt(x.gold))}</div>`:''}</div>`; }
R.D=(sc,p)=>`<div class="d-wrap"><header class="d-top"><div class="d-brand">v4 시험 대시보드<small>공유저작물 속성정보 정확도 · 합격 기준 Macro-F1 85%</small></div>
 <nav class="d-nav" aria-label="화면">${SCREENS.map(s=>`<button type="button" id="${p}nav${s.n}" data-act="screen" data-v="${s.n}"${s.n===sc?' aria-current="page"':''}>${s.label}</button>`).join('')}</nav>${sc===2||sc===5?'':dTestSeg(p)}</header>${D[sc](p)}</div>`;

 const drop=(slot,t,acc)=>`<div class="d-drop"><span class="ic">${ic(slot==='work'?(set.media==='video'?'video':'image'):'doc',20)}</span><span class="tx"><b>${t}</b><span>${esc(fileLabel(slot,set))}</span></span><label class="d-btn" for="${p}f-${slot}">${ic('upload',14)} 파일 선택</label><input class="sr" type="file" id="${p}f-${slot}" data-file="${slot}" accept="${acc}"></div>`;
 return `<div class="d-grid">
 <section class="d-card d-s7"><h2 class="d-ct">새 시험</h2><p class="d-cs">시험 종류를 고르고 파일을 올리면 23개 항목을 추출합니다</p>

  <div class="d-fgrid" style="margin-top:16px;align-items:end"><div class="d-field"><label for="${p}set">예시 세트</label><select class="d-in" id="${p}set" data-bind="set">${setOptions(test)}</select></div><div><button type="button" class="d-btn pri" id="${p}run" data-act="run-single"${run?' disabled':''} style="width:100%;justify-content:center">${ic('play',16)} ${run?'처리 중…':'시험 실행'}</button></div></div>

 <section class="d-card d-s5"><h2 class="d-ct">진행 단계</h2><p class="d-cs">${esc(set.id)} · ${cellKo(set.cell)}</p><ol class="d-tl">${steps.map((s,i)=>{const st=stepState(i,test);return `<li class="${st}"><span class="dot">${st==='done'?ic('check',14):i+1}</span><span><b>${s.l}</b><span>${esc(s.d)}</span></span><span class="x">${st==='skip'?'생략':st==='wait'?'':esc(s.x)}</span></li>`;}).join('')}</ol></section>

  <div class="d-kgrid">${grouped(rows).map(g=>{const n=g.rows.filter(r=>r.scored).length;return `<div class="d-kg"><h4>${g.g}<span>${n?`채점 ${n}개`:'채점 제외'}</span></h4>${g.rows.map(r=>`<dl class="d-kv${r.scored?'':' off'}"><dt>${r.no}. ${esc(r.label)}<small>${r.scored?'채점':'채점 제외'}${r.src?' · '+r.src:''}</small></dt><dd>${vh(r,D_V)}</dd></dl>`).join('')}</div>`;}).join('')}</div></section>`:`<section class="d-card d-s12"><p class="d-cs" style="margin:0">추출이 끝나면 23개 항목이 그룹별 카드로 표시됩니다.</p></section>`}</div>`; };

 return `<div class="d-grid"><section class="d-card d-s12"><h2 class="d-ct">시험 목록</h2><p class="d-cs">고정 목록(seed 20261009)에서 고릅니다</p><div class="d-opts">${Object.entries(SOURCES).map(([k,s])=>`<button type="button" class="d-opt" id="${p}src-${k}" data-act="src" data-v="${k}" aria-pressed="${b.source===k}"><span class="ic">${ic(s.test==='T-001'?'doc':'image',18)}</span><span><b>${s.label}</b><span>${esc(s.note)}</span>${s.blocked?'<span class="d-chip warn" style="margin-top:6px">대기</span>':''}</span></button>`).join('')}</div></section>

let singleTimer=null, simTimer=null;
function runSingle(){ clearInterval(singleTimer); S.single.phase='running'; S.single.step=0; render();
  singleTimer=setInterval(()=>{ S.single.step++; if(S.single.step>=STEPS.length){ S.single.phase='done'; S.single.step=STEPS.length; clearInterval(singleTimer); toast('23개 항목을 추출했습니다 (예시 세트 결과)'); } render(); },480); }
function simStart(){ clearInterval(simTimer); const test=S.test, tl=timeline(test); S.sim={test,status:'running',t:0}; S.eSel=null; render(); toast(`${test==='T-001'?'T-001 잠정 5건':'T-002 개발 실행 3건'} 실행을 시작했습니다 (로그 재생)`);
  const step=tl.end/50; simTimer=setInterval(()=>{ S.sim.t=Math.min(tl.end,S.sim.t+step); if(S.sim.t>=tl.end){ S.sim.status='done'; clearInterval(simTimer); toast('일괄 시험과 채점이 끝났습니다'); } render(); },120); }
function simCancel(){ if(S.sim.status!=='running') return; clearInterval(simTimer); S.sim.status='cancelled'; S.sim.at=S.sim.t; render(); toast('실행을 취소했습니다. 끝난 세트의 결과는 남습니다'); }

/* ---------- actions ---------- */
const ACT={
  style:v=>{ S.style=v; S.compare=false; render(); scrollStage(); },
  'open-style':v=>{ S.style=v; S.compare=false; render(); scrollStage(); },
  screen:v=>{ S.screen=+v; render(); },
  compare:()=>{ S.compare=!S.compare; render(); },
  cols:v=>{ S.cols=+v; render(); },
  test:v=>{ if(S.test!==v){ S.test=v; if(S.screen===2) setSource(v==='T-001'?'t001_5':'pilot200'); } render(); },
  theme:v=>{ S.theme=v; applyTheme(); render(); },
  'run-single':()=>runSingle(),
  'dl-json':()=>{ const set=curSet(); download(`${set.id}_${S.test}.json`,JSON.stringify(predRecord(set,true),null,2)+'\n','application/json'); },
  dl:(v,t)=>download(v,fileContent(v,t.dataset.t||S.test),DL_TYPES[v]),
  atab:v=>{ S.aTab=v; render(); },
  etab:v=>{ S.eTab=v; render(); },
  src:v=>{ setSource(v); render(); },
  'sim-start':()=>{ if(S.screen===2){ const e=est(); if(e.blocked||!e.n) return; S.test=e.src.test; } S.screen=3; simStart(); },
  'sim-cancel':()=>simCancel(),
  drill:v=>{ S.drill[S.test]=S.drill[S.test]===v?null:v; render(); },
  esel:v=>{ S.eSel=v; render(); },
  esel4:v=>{ S.drill[S.test]=v; render(); },
  hist:v=>{ S.hist=v; render(); },
  'open-run':v=>{ const r=RUNS.find(x=>x.id===v); if(!r||!r.data){ toast('이 실행은 저장된 상세 결과가 없습니다'); return; } S.test=r.data; S.screen=4; S.compare=false; S.hist=v; render(); scrollStage(); toast(`${r.name} 결과를 열었습니다`); },
  'step-set':v=>{ const n=sets(S.test).length; S.setIdx[S.test]=(S.setIdx[S.test]+(+v)+n)%n; render(); }
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.closest('[inert]')) return; if(t.disabled) return; const f=ACT[t.dataset.act]; if(f) f(t.dataset.v,t,e); });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.file){ const f=t.files&&t.files[0]; S.single.files[t.dataset.file]=f?{name:f.name,size:f.size}:null; if(f) toast(`${f.name} 선택됨 · 시안에서는 예시 세트 결과를 보여 줍니다`); render(); return; }
  if(t.dataset.check){ const k=ekey(curSet()); (S.checks[k]=S.checks[k]||{})[t.dataset.check]=t.checked; patchE(); return; }
  const b=t.dataset.bind; if(!b) return;
  if(b==='set'){ S.setIdx[S.test]=+t.value; render(); return; }
  if(b==='cell'){ const c=t.dataset.v; if(t.checked){ if(!S.batch.cells.includes(c)) S.batch.cells.push(c); } else S.batch.cells=S.batch.cells.filter(x=>x!==c); S.batch.n=est().tot; render(); return; }
  if(b==='n') S.batch.n=Math.max(1,Math.round(+t.value||1));
  if(b==='workers') S.batch.workers=Math.max(1,Math.min(8,Math.round(+t.value||1)));
  if(b==='tau') S.batch.tau=Math.max(0.5,Math.min(0.9,+t.value||0.65));
  if(b==='gold') S.batch.gold=t.value;
  if(b==='onlyPred') S.batch.onlyPred=t.checked;
  if(b==='consWork') S.batch.consWork=t.checked;
  render(); });
document.addEventListener('input',e=>{ const t=e.target; if(!t.dataset||!t.dataset.edit) return; const set=curSet(), k=t.dataset.edit, K=KBY[k], ek=ekey(set);
  const raw=t.value.trim(); let val;
  if(raw===''||raw.toUpperCase()==='NULL') val=null;
  else if(K.type==='name_list'||K.type==='tag_list') val=raw.split(',').map(x=>x.trim()).filter(Boolean);
  else if(K.type==='int') val=/^\d+$/.test(raw)?+raw:raw;
  else val=raw;
  const orig=set.rec[k]==null?null:set.rec[k], same=JSON.stringify(orig)===JSON.stringify(val);
  S.edits[ek]=S.edits[ek]||{}; if(same) delete S.edits[ek][k]; else S.edits[ek][k]=val;
  t.classList.toggle('mod',!same); t.classList.toggle('null',val==null); patchE(); });
function patchE(){ const set=curSet(), ek=ekey(set), chk=S.checks[ek]||{};
  document.querySelectorAll('#stage [data-ejson]').forEach(el=>{ el.textContent=JSON.stringify(predRecord(set,true),null,2); });
  document.querySelectorAll('#stage [data-esum]').forEach(el=>{ el.textContent=`확인 ${Object.values(chk).filter(Boolean).length} / 23 · 수정 ${Object.keys(S.edits[ek]||{}).length}`; }); }
function hl(e,on){ const f=e.target.closest&&e.target.closest('.e-field[data-k]'); if(!f||f.closest('[inert]')) return; f.classList.toggle('hl',on); document.querySelectorAll(`#stage .e-doc mark[data-k="${f.dataset.k}"]`).forEach(m=>m.classList.toggle('on',on)); }
document.addEventListener('mouseover',e=>hl(e,true)); document.addEventListener('mouseout',e=>hl(e,false));
document.addEventListener('focusin',e=>hl(e,true)); document.addEventListener('focusout',e=>hl(e,false));

/* ---------- chart tooltip (hover and keyboard focus) ---------- */
const tip=$('#tip');
function showTip(el,x,y){ tip.querySelector('b').textContent=el.dataset.tipv; tip.querySelector('span').textContent=el.dataset.tipl; tip.hidden=false; const r=tip.getBoundingClientRect(); let L=x+14,T=y+14; if(L+r.width>innerWidth-8) L=x-r.width-14; if(T+r.height>innerHeight-8) T=y-r.height-14; tip.style.left=Math.max(8,L)+'px'; tip.style.top=Math.max(8,T)+'px'; }
document.addEventListener('pointermove',e=>{ const el=e.target.closest&&e.target.closest('[data-tipv]'); if(el&&!el.closest('[inert]')) showTip(el,e.clientX,e.clientY); else if(!tip.hidden&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.tipv)) tip.hidden=true; });
document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('[data-tipv]'); if(el){ const r=el.getBoundingClientRect(); showTip(el,r.left+r.width*0.55,r.bottom-2); } });
document.addEventListener('focusout',()=>{ tip.hidden=true; });
addEventListener('scroll',()=>{ if(!tip.hidden) tip.hidden=true; },{passive:true});
addEventListener('resize',()=>{ if(S.compare) scaleCompare(); });
addEventListener('hashchange',()=>{ if(readHash()) render(); });

/* ---------- init ---------- */
S.cardOpen=innerWidth>=700;
loadPrefs(); readHash();
setSource(S.test==='T-001'?'t001_5':'pilot200');
applyTheme(); buildChrome(); render();
</script>
