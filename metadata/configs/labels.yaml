# =============================
# Label schema & routing config (5-stage, with ko comments)
# =============================

# ---- CSV 메타데이터 라벨 (English : 한국어) ----
schema_labels:
  [seq_number,          # 순번
   site_name,           # 사이트명
   agency_name,         # 기관명
   board_name,          # 게시판명
   board_path,          # 게시판 진입 과정
   category,            # 카테고리
   work_title,          # 저작물명
   url,                 # URL
   description,         # 설명
   created_date,        # 작성일
   registration_date,   # 등록일
   production_date,     # 제작일
   valid_period,        # 유효기간
   attachment,          # 첨부파일
   video_count,         # 영상
   photo_count,         # 사진
   document_count,      # 문서
   quantity,            # 수량
   view_count,          # 조회수
   kogl_type,           # 공공누리유형
   disclosure_type,     # 공개유형
   copyrightability,    # 저작물성
   unprotected_work,    # 비보호저작물
   work_for_hire,       # 업무상저작물
   copyright_holder,    # 저작권자
   co_author,           # 공동저작자
   neighboring_rights_holder, # 저작인접권자
   co_author_consent,   # 공동저작자동의
   third_party_rights,  # 제3자 권리
   economic_rights,     # 저작재산권
   commercial_use,      # 상업적이용허락
   portrait_rights,     # 초상권
   personal_info,       # 개인정보
   contract,            # 계약서
   review_impossible,   # 검토불가
   work_type,           # 유형
   digital_format,      # 디지털형태
   keyword,             # 주제어
   language,            # 언어
   phone,               # 전화번호
   memo]                # 비고

# 1) REGEX (형식 고정)
regex_labels:
  phone: '\d{2,3}\s*[-]?\s*\d{3,4}\s*[-]?\s*\d{4}'  # phone : 전화번호 (유연한 띄어쓰기 허용)

# 2) DATETIME (규칙+파서)
datetime_labels:
  [created_date,      # 작성일
   registration_date, # 등록일
   production_date,   # 제작일
   valid_period]      # 유효기간

# 3) NUMERIC (정수/카운트/순번)
numeric_labels:
  [seq_number,     # 순번
   quantity,       # 수량
   video_count,    # 영상
   photo_count,    # 사진
   document_count, # 문서
   view_count]     # 조회수

# 4) NER (고유명사/실체명)
ner_labels:
  [site_name,                # 사이트명
   agency_name,              # 기관명
   board_name,               # 게시판명
   copyright_holder,         # 저작권자
   co_author,                # 공동저작자
   neighboring_rights_holder, # 저작인접권자
   work_title]               # 저작물명

# 5) TEXT (분류/상태/제목/설명 등)
#  - 내부 엔진: short → Classic(LogReg), long → LLM
text_labels:
  [category,               # 카테고리
   board_path,             # 게시판 진입 과정
   attachment,             # 첨부파일
   kogl_type,              # 공공누리유형
   disclosure_type,        # 공개유형
   copyrightability,       # 저작물성
   unprotected_work,       # 비보호저작물
   work_for_hire,          # 업무상저작물
   co_author_consent,      # 공동저작자동의
   third_party_rights,     # 제3자 권리
   economic_rights,        # 저작재산권
   commercial_use,         # 상업적이용허락
   portrait_rights,        # 초상권
   personal_info,          # 개인정보
   contract,               # 계약서
   review_impossible,      # 검토불가
   work_type,              # 유형
   digital_format,         # 디지털형태
   keyword,                # 주제어
   language,               # 언어
   description,            # 설명
   memo]                   # 비고

# ---- CSV 헤더 별칭 매핑 (한국어 → 영문 라벨) ----
header_aliases:
  seq_number: [순번, RECOMMEND_IDX]
  site_name: [사이트명]
  agency_name: [기관명, 촬영원본]
  board_name: [게시판명]
  board_path: [게시판 진입 과정]
  category: [카테고리, 대분류코드, 중분류코드, 소뷴류코드, 소분류코드]
  work_title: [저작물명, 저작물제목]
  url: [URL]
  description: [설명]
  created_date: [작성일]
  registration_date: [등록일]
  production_date: [제작일, 촬영년도]
  valid_period: [유효기간]
  attachment: [첨부파일, FILE_NAME, FILE_ORG_NAME, FILE_PATH, WEB_FILE_PATH]
  video_count: [영상]
  photo_count: [사진]
  document_count: [문서]
  quantity: [수량]
  view_count: [조회수]
  kogl_type: [공공누리유형]
  disclosure_type: [공개유형]
  copyrightability: [저작물성]
  unprotected_work: [비보호저작물]
  work_for_hire: [업무상저작물]
  copyright_holder: [저작권자, 원본소유자]
  co_author: [공동저작자]
  neighboring_rights_holder: [저작인접권자]
  co_author_consent: [공동저작자동의]
  third_party_rights: [제3자 권리]
  economic_rights: [저작재산권]
  commercial_use: [상업적이용허락]
  portrait_rights: [초상권]
  personal_info: [개인정보]
  contract: [계약서]
  review_impossible: [검토불가]
  work_type: [유형, 저작물유형, 저작물구분]
  digital_format: [디지털형태, 저작물구분]
  keyword: [주제어, HASHTAG]
  language: [언어]
  phone: [전화번호]
  memo: [비고]

routing:
  sentence_min_chars: 40
  reject_threshold: 0.6
  priority: [regex, datetime, numeric, ner, text]
