# 35-label 메타데이터 스키마 + 3-way 추출 분할.
# 실제 enforcement 는 module/parts/labels.py (REGEX/NER/LLM 세트).
# 이 파일은 functional config 의 단일 source — 모든 stage 의 기본 path/디렉터리/모델/임계값.
# api.py 와 main.py 는 여기 값을 읽기만 함 (하드코딩 금지).

# ──────────────────────────────────────────────
# Paths — 인자 미지정 시 stage 가 사용하는 기본 경로
# ──────────────────────────────────────────────
paths:
  # ocr_extract 입력 (PDF/이미지 디렉터리)
  input: data/in/document
  # ocr_extract 출력 루트 (안에 result/ 와 result/metadata/ 자동 생성)
  ocr_output: data/out/ocr
  # ner_predict 입력 (OCR 평문 텍스트 디렉터리)
  ner_input: data/out/ocr/result
  # ner_predict 출력 (35-라벨 JSON 디렉터리)
  metadata_output: data/out/metadata

# ──────────────────────────────────────────────
# OCR — Qwen3-VL (Apache-2.0, 상업 OK, 한국어 강함)
# CPU 는 코드에서 거부함. GPU 만 허용.
# ──────────────────────────────────────────────
ocr:
  device: cuda:0
  qwen3vl:
    # 12GB VRAM (RTX 5070) 기준. 공식 Apache-2.0 BF16, ~5GB. 양자화 압축해제 spike 없음.
    # 더 큰 GPU 면 Qwen/Qwen3-VL-4B-Instruct (BF16 ~9GB) 또는 8B BF16 권장.
    model_id: Qwen/Qwen3-VL-2B-Instruct
    max_new_tokens: 4096
    render_zoom: 2.0  # PDF 2x = ~144 DPI
  # OCR 엔진이 내뱉는 raw label 을 표준 키로 정규화.
  normalize_map: {}

# ──────────────────────────────────────────────
# Regex 추출 (9 labels) — module/extractor/regex.py
# 패턴은 코드 (PATTERNS dict). 여기는 라벨 목록만 (동기화 참조용).
# ──────────────────────────────────────────────
regex:
  labels:
    - phone
    - email
    - copyright_url
    - copyright_uci
    - date
    - ri_money
    - copyright_num
    - copyright_idnum
    - copyright_quantity

# ──────────────────────────────────────────────
# NER 추출 (17 labels) — module/extractor/ner/
# threshold / threshold_per_label 는 _runtime.load_ner_thresholds_from_yaml 가 읽음.
# ──────────────────────────────────────────────
ner:
  # ner_predict 기본값 (인자 미지정 시 사용)
  model_name: google-bert/bert-base-multilingual-cased
  threshold: 0.25
  result_phase: latest
  labels:
    - copyright_kotitle
    - copyright_status
    - copyright_description
    - copyright_Keyword
    - copyright_language
    - copyright_type
    - name
    - company
    - address
    - position
    - department
    - ri_data
    - ri_period
    - ri_info
    - ri_contract_type
    - ri_copyright
    - ri_law_reference
  # threshold: 0.25
  # threshold_per_label:
  #   name: 0.35

# ──────────────────────────────────────────────
# LLM 추출 (9 labels, 미구현)
# ──────────────────────────────────────────────
llm:
  labels:
    - copyright_id
    - copyright_Pname
    - copyright_con_status
    - ri_cpcheck
    - ri_uncopyright
    - ri_workhire
    - ri_consent_type
    - ri_jch_conset
    - ri_portrait
