<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:,">
<title>저작물 속성정보 추출 시스템 {{ version or 'v1.0' }} — 시험 콘솔</title>
<script>try{if(localStorage.getItem('console-theme')==='light')document.documentElement.setAttribute('data-theme','light');var t=localStorage.getItem('console-text');if(t==='lg'||t==='xl')document.documentElement.setAttribute('data-text',t);}catch(e){}</script>
{% raw %}
<style>
/* 계측 콘솔: dark-first graphite, amber readouts, status lights, monospace numerals (light variant on request) */
:root{
  --f-sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"D2Coding","JetBrains Mono","Consolas","NanumGothicCoding","Noto Sans Mono CJK KR",ui-monospace,monospace;
  /* 글자 크기: 단계(--fz-1…10) × 화면 배율(--fs). 기본 1 · 크게 1.15 · 발표 1.3 (상단 '글자' 버튼, data-text) */
  --fs:1;
  --fz-1:calc(11.5px * var(--fs));--fz-2:calc(12px * var(--fs));--fz-3:calc(12.5px * var(--fs));--fz-4:calc(13px * var(--fs));--fz-5:calc(13.5px * var(--fs));
  --fz-6:calc(14px * var(--fs));--fz-7:calc(14.5px * var(--fs));--fz-8:calc(15px * var(--fs));--fz-9:calc(18px * var(--fs));--fz-10:calc(26px * var(--fs));
  --rw:calc(76px * var(--fs));
  --c0:#0a0d10;--c1:#11151a;--c2:#171c22;--c3:#1d232b;--cl:#252d36;--ci:#d3dae1;--ci2:#a3adba;--cd:#848f9d;--ca:#f5a524;--cok:#3ccf7a;--cwarn:#ffd24a;--cerr:#ff6b6b;
  --focus:#7ea6ff;--cinfo:#7ea6ff;--hl:rgba(245,165,36,.11);--onacc:#0a0d10;--tipbg:#ececee;--tipink:#141416;--shade:rgba(0,0,0,.55);
  --f1-bar:#c97d0b;--f1-track:#1a2027;--f1-ink:#d3dae1;--f1-ink2:#a3adba;--f1-ref:#ff6b6b;--f1-axis:#33404c;
  --errbg:rgba(255,107,107,.09);--warnbg:rgba(255,210,74,.1);
  --hlm:rgba(255,186,28,.46);--hlm2:rgba(255,170,0,.68);--hlap:#b86e00;--hlon:#4f7fff;--hlsel:#ff5a36;--hlink:#1d1300;
  color-scheme:dark;
}
:root[data-text="lg"]{--fs:1.15}
:root[data-text="xl"]{--fs:1.3}
:root[data-theme="light"]{--c0:#e4e7ea;--c1:#f3f5f6;--c2:#ffffff;--c3:#eef1f3;--cl:#c3cad1;--ci:#10151a;--ci2:#3e4853;--cd:#58636f;--ca:#8f5100;--cok:#11773b;--cwarn:#7d5c00;--cerr:#c22525;
  --focus:#2f6fdb;--cinfo:#2456b0;--hl:rgba(154,88,0,.09);--onacc:#ffffff;--tipbg:#1b1b1d;--tipink:#fafaf8;--shade:rgba(16,21,26,.18);
  --f1-bar:#b86d00;--f1-track:#e7eaed;--f1-ink:#10151a;--f1-ink2:#3e4853;--f1-ref:#c22525;--f1-axis:#aab3bc;--errbg:rgba(194,37,37,.075);--warnbg:rgba(125,92,0,.09);
  --hlm:rgba(255,232,0,.5);--hlm2:rgba(255,214,0,.78);--hlap:#8a6400;--hlon:#2f6fdb;--hlsel:#d9480f;--hlink:#1d1300;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--c0);color:var(--ci);font:var(--fz-6)/1.5 var(--f-sans)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ca)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--ca)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--ci2)} .dimmer{color:var(--cd)}
.okc{color:var(--cok)} .errc{color:var(--cerr)} .warnc{color:var(--cwarn)} .accc{color:var(--ca)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- frame: icon rail + main ---------- */
.app{display:grid;grid-template-columns:var(--rw) minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--c1) 0 calc(var(--rw) - 1px),var(--cl) calc(var(--rw) - 1px) var(--rw),transparent var(--rw))}
.rail{background:var(--c1);border-right:1px solid var(--cl);display:flex;flex-direction:column;gap:4px;padding:10px 6px;position:sticky;top:0;height:100vh;z-index:5}
.rail .logo{font-family:var(--f-mono);font-size:var(--fz-1);color:var(--ca);text-align:center;letter-spacing:.06em;padding:4px 0 10px;border-bottom:1px solid var(--cl);margin-bottom:4px;line-height:1.4}
.rail .logo b{display:block;font-size:var(--fz-6);letter-spacing:.04em}
.rail button{background:transparent;border:1px solid transparent;color:var(--ci2);padding:8px 2px 6px;word-break:keep-all;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fz-2);border-radius:3px;line-height:1.2;text-align:center;position:relative}
.rail button:hover{color:var(--ci);border-color:var(--cl)}
.rail button[aria-current="page"]{color:var(--ca);border-color:var(--cl);background:var(--c2)}
.rail .k{font-family:var(--f-mono);font-size:var(--fz-1);color:var(--cd)}
.rail .badge{position:absolute;top:6px;right:9px}
.rail .grow{flex:1}
.main{min-width:0;padding:12px 16px 28px;display:flex;flex-direction:column;gap:10px}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border:1px solid var(--cl);background:var(--c1);padding:7px 10px;font-size:var(--fz-4)}
.top .sys{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.top .sys b{font-size:var(--fz-7);color:var(--ci);letter-spacing:-.01em}
.top .sys .ver{font-family:var(--f-mono);color:var(--ca);font-weight:700;letter-spacing:.04em;font-size:var(--fz-5)}
.top .sys small{color:var(--ci2);font-size:var(--fz-4)}
.lights{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-family:var(--f-mono);font-size:var(--fz-3);color:var(--ci2)}
.lights b{color:var(--ci);font-weight:600}
.lights .lk{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.top .sp{flex:1}
.top .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .who .u{font-family:var(--f-mono);font-size:var(--fz-4);color:var(--ci)}
.models{font-family:var(--f-mono);font-size:var(--fz-2);color:var(--cd);padding:0 2px;margin-top:-4px}
.models>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px;user-select:none;font-family:var(--f-sans)}
.models>summary::-webkit-details-marker{display:none}
.models>summary::before{content:'▸';display:inline-block;transition:transform .15s}
.models[open]>summary::before{transform:rotate(90deg)}
.models>summary:hover,.models>summary:focus-visible{color:var(--ci2)}
.models .mlist{display:flex;flex-wrap:wrap;gap:3px 16px;margin-top:3px}
.models b{color:var(--ci2);font-weight:600}
.banner{border:1px solid var(--cl);border-left:3px solid var(--cerr);background:var(--c1);padding:9px 12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner b{color:var(--cerr)}
.banner code{font-family:var(--f-mono);background:var(--c0);border:1px solid var(--cl);padding:1px 6px;font-size:var(--fz-4);overflow-wrap:anywhere}
.banner .sp{flex:1}

/* ---------- status lights ---------- */
.c-led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cd);margin-right:5px;vertical-align:0;flex-shrink:0}
.c-led.ok{background:var(--cok);box-shadow:0 0 6px var(--cok)}
.c-led.run{background:var(--ca);box-shadow:0 0 6px var(--ca);animation:cBlink 1s steps(2,start) infinite}
.c-led.err{background:var(--cerr);box-shadow:0 0 6px var(--cerr)}
.c-led.warn{background:var(--cwarn)}
.c-led.off{background:transparent;border:1px solid var(--cd)}
@keyframes cBlink{to{visibility:hidden}}

/* ---------- panels ---------- */
.c-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;align-items:start}
.c-s3{grid-column:span 3}.c-s4{grid-column:span 4}.c-s5{grid-column:span 5}.c-s6{grid-column:span 6}.c-s7{grid-column:span 7}.c-s8{grid-column:span 8}.c-s12{grid-column:1/-1}
.c-grid.stretch{align-items:stretch}
.c-panel{background:var(--c1);border:1px solid var(--cl);min-width:0;display:flex;flex-direction:column}
.c-ph{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;padding:6px 10px;border-bottom:1px solid var(--cl);font-size:var(--fz-3);color:var(--ci2);flex-wrap:wrap;min-height:33px}
.c-ph .t{font-weight:700;color:var(--ci);font-size:var(--fz-5);letter-spacing:.01em}
.c-ph b{color:var(--ca);font-weight:600;font-family:var(--f-mono)}
.c-ph .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.c-ph .tl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
.c-pb{padding:10px;min-width:0}
.c-pb.flush{padding:0}
.stack{display:flex;flex-direction:column;gap:10px}
.c-reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(128px * var(--fs)),1fr));gap:1px;background:var(--cl);border:1px solid var(--cl)}
.c-read{background:var(--c1);padding:8px 10px;min-width:0}
.c-read .l{font-size:var(--fz-2);color:var(--cd);letter-spacing:.02em}
.c-read .v{font-family:var(--f-mono);font-size:var(--fz-10);line-height:1.2;color:var(--ca);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-read .v.ok{color:var(--cok)} .c-read .v.err{color:var(--cerr)} .c-read .v.dim{color:var(--ci)} .c-read .v.sm{font-size:var(--fz-9);line-height:1.6}
.c-read .s{font-size:var(--fz-2);color:var(--ci2);overflow-wrap:anywhere}
.c-tw{overflow-x:auto}
.c-t{width:100%;border-collapse:collapse;font-size:var(--fz-4)}
.c-t th{font-weight:600;font-size:var(--fz-2);color:var(--cd);text-align:left;padding:5px 6px;border-bottom:1px solid var(--cl);white-space:nowrap;background:var(--c1)}
.c-t td{padding:4px 6px;border-bottom:1px solid var(--c2);vertical-align:top;overflow-wrap:anywhere}
.c-t td.n,.c-t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-t td.k{font-family:var(--f-mono);color:var(--ci2);font-size:var(--fz-2);white-space:nowrap}
.c-t td.nw{white-space:nowrap}
.c-t tr.g td{color:var(--ca);font-size:var(--fz-2);font-weight:700;letter-spacing:.04em;padding-top:9px;border-bottom:1px solid var(--cl);background:var(--c1)}
.c-t tr.g td .gs{float:right;color:var(--cd);font-weight:500;font-family:var(--f-mono);letter-spacing:0}
.c-t tr.off td{color:var(--cd)}
.c-t tr.click{cursor:pointer}
.c-t tr.click:hover td{background:var(--c2)}
.c-t tr.open>td{background:var(--c2)}
.c-t tbody tr.sel td{background:var(--hl)}
.c-t tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ca)}
.c-t .sticky-h th{position:sticky;top:0;z-index:1}
.c-tag{font-family:var(--f-mono);font-size:var(--fz-1);padding:0 5px;border:1px solid var(--cl);color:var(--ci2);border-radius:2px;white-space:nowrap;display:inline-block;line-height:calc(17px * var(--fs))}
.c-tag.sc{border-color:var(--ca);color:var(--ca)}
.c-tag.ok{border-color:var(--cok);color:var(--cok)}
.c-tag.err{border-color:var(--cerr);color:var(--cerr)}
.c-null{font-family:var(--f-mono);color:var(--cd)}
.c-na{color:var(--cd)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:var(--fz-2);line-height:calc(18px * var(--fs));padding:0 6px;border:1px solid var(--cl);border-radius:2px;margin:1px 3px 1px 0;color:var(--ci);background:var(--c2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.chip.allow{color:var(--cok);border-color:var(--cok);font-weight:700;font-family:var(--f-sans);background:transparent}
.chip.deny{color:var(--cerr);border-color:var(--cerr);font-weight:700;font-family:var(--f-sans);background:transparent}
.chip.m{border-color:var(--cok);color:var(--cok)}
.chip.x{border-color:var(--cerr);color:var(--cerr)}
.c-btn{font-family:var(--f-sans);font-size:var(--fz-4);background:var(--c2);border:1px solid var(--cl);color:var(--ci);padding:5px 10px;border-radius:3px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;line-height:1.35}
.c-btn:hover{border-color:var(--ci2)}
.c-btn.pri{border-color:var(--ca);color:var(--ca);font-weight:700}
.c-btn.pri.solid{background:var(--ca);color:var(--onacc)}
.c-btn.danger{border-color:var(--cerr);color:var(--cerr)}
.c-btn.danger.armed{background:var(--cerr);color:var(--onacc)}
.c-btn.sm{padding:2px 7px;font-size:var(--fz-3)}
.c-btn:disabled,.c-btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.c-btn svg{flex-shrink:0}
.c-seg{display:inline-flex;border:1px solid var(--cl);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.c-seg button{background:var(--c2);border:0;border-right:1px solid var(--cl);color:var(--ci2);padding:5px 11px;font-size:var(--fz-4)}
.c-seg button:last-child{border-right:0}
.c-seg button[aria-pressed="true"]{background:var(--ca);color:var(--onacc);font-weight:700}
.c-seg button:disabled{opacity:.45;cursor:not-allowed}
.c-seg.sm button{padding:2px 8px;font-size:var(--fz-3)}
.c-form{display:grid;grid-template-columns:calc(104px * var(--fs)) minmax(0,1fr);gap:7px 10px;align-items:center}
.c-form>label,.c-form>.fl{font-size:var(--fz-3);color:var(--ci2)}
.c-lab{font-size:var(--fz-3);color:var(--ci2);display:block;margin-bottom:4px}
.c-lab em{font-style:normal;color:var(--ca);margin-left:4px;font-size:var(--fz-1)}
.c-in{background:var(--c0);border:1px solid var(--cl);color:var(--ci);padding:4px 7px;font-family:var(--f-mono);font-size:var(--fz-4);border-radius:2px;width:100%;min-width:0}
.c-in:focus{border-color:var(--ca);outline:none}
select.c-in{font-family:var(--f-sans)}
textarea.c-in{resize:vertical;min-height:90px;line-height:1.45}
.inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.inl .c-in{width:auto;flex:1 1 70px}
.ck{display:flex;gap:6px;align-items:flex-start;font-size:var(--fz-4);color:var(--ci)}
.ck input{margin-top:3px}
.ck small{display:block;color:var(--cd);font-size:var(--fz-2)}
.hint{font-size:var(--fz-3);color:var(--cd);margin:0}
.msg{font-size:var(--fz-4);min-height:0}
.msg.err{color:var(--cerr)} .msg.ok{color:var(--cok)}
.c-chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(150px * var(--fs)),1fr));gap:5px 10px}
.c-chk label{display:flex;gap:6px;align-items:center;font-size:var(--fz-4);color:var(--ci);min-width:0}
.c-chk label .cc{font-family:var(--f-mono);font-size:var(--fz-1);color:var(--cd)}
.c-chk label span.n{color:var(--cd);margin-left:auto;font-family:var(--f-mono)}
.c-radio{display:flex;flex-direction:column;gap:4px}
.c-radio label{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 7px;border:1px solid var(--cl);background:var(--c2);font-size:var(--fz-5);cursor:pointer}
.c-radio label.on{border-color:var(--ca)}
.c-radio label.dis{opacity:.6;cursor:not-allowed}
.c-radio label small{display:block;color:var(--cd);font-size:var(--fz-2)}
.c-radio .st{font-family:var(--f-mono);font-size:var(--fz-2);color:var(--ci2);white-space:nowrap}
.c-log{font-family:var(--f-mono);font-size:var(--fz-3);line-height:1.55;background:var(--c0);border:1px solid var(--cl);padding:8px 10px;height:max(320px,calc(100vh - 340px));overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
.c-log .ts{color:var(--cd)} .c-log .lv{color:var(--cok)} .c-log .wv{color:var(--cwarn)} .c-log .er{color:var(--cerr)} .c-log .id{color:var(--ca)}
.c-json{font-family:var(--f-mono);font-size:var(--fz-2);line-height:1.5;white-space:pre-wrap;word-break:break-all;margin:0;color:var(--ci2)}
.c-json .jk{color:var(--ca)} .c-json .js{color:var(--ci)} .c-json .jn{color:var(--cok)} .c-json .jl{color:var(--cd)}
.c-trace{display:grid;grid-template-columns:16px calc(92px * var(--fs)) minmax(0,1fr) calc(72px * var(--fs));gap:7px 10px;align-items:baseline;font-size:var(--fz-4)}
.c-trace .sl{font-weight:600}
.c-trace .sl.wait,.c-trace .sl.skip{color:var(--cd)}
.c-trace .sl.on{color:var(--ca)}
.c-trace .sl.err{color:var(--cerr)}
.c-trace .s{color:var(--ci2);overflow-wrap:anywhere}
.c-trace .x{text-align:right;font-family:var(--f-mono);color:var(--ci2);font-variant-numeric:tabular-nums}
.c-bar{height:6px;background:var(--c2);border:1px solid var(--cl);position:relative}
.c-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ca);transition:width .3s}
.c-bar i.f{background:var(--cerr);left:auto}
.c-bar u{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--cerr)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:var(--fz-1);color:var(--cd);margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{padding:22px 14px;color:var(--ci2);text-align:center}
.empty b{display:block;color:var(--ci);font-size:var(--fz-7);margin-bottom:4px}

/* ---------- upload zones ---------- */
.drop{border:1px dashed var(--cl);background:var(--c0);padding:9px 10px;display:flex;flex-direction:column;gap:5px;border-radius:3px;min-width:0;transition:border-color .15s}
.drop.over{border-color:var(--ca);background:var(--hl)}
.drop:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.drop.has{border-style:solid}
.drop .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drop .h .c-lab{margin:0}
.drop .nm{font-family:var(--f-mono);font-size:var(--fz-3);color:var(--ci);overflow-wrap:anywhere}
.drop .nm.none{color:var(--cd);font-family:var(--f-sans)}
.drop .nm small{color:var(--cd)}
.upbar{height:4px;background:var(--c2);position:relative;overflow:hidden}
.upbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ca)}

/* ---------- verdict marks ---------- */
.vd{display:inline-block;font-family:var(--f-mono);font-size:var(--fz-1);line-height:calc(17px * var(--fs));padding:0 5px;border:1px solid var(--cl);border-radius:2px;white-space:nowrap;color:var(--ci2)}
.vd.TP,.vd.EMPTY_OK{color:var(--cok);border-color:var(--cok)}
.vd.EMPTY_OK{border-style:dashed}
.vd.PARTIAL{color:var(--cwarn);border-color:var(--cwarn);background:var(--warnbg)}
.vd.WRONG,.vd.FP,.vd.FN{color:var(--cerr);border-color:var(--cerr)}
.vd.NA{color:var(--cd);border-style:dashed}
.mx td.m,.mx th.m{text-align:center;padding:3px 2px;width:calc(34px * var(--fs))}
.mx th.m{font-family:var(--f-mono);font-size:var(--fz-1);color:var(--ci2);cursor:help}
.mx th.m.hk,.mx td.m.hk{background:var(--hl)}
.mx .cell{display:block;font-family:var(--f-mono);font-size:var(--fz-1);line-height:calc(19px * var(--fs));min-width:calc(28px * var(--fs));border:1px solid var(--cl);color:var(--cd);text-align:center;border-radius:2px}
.mx .cell.TP,.mx .cell.EMPTY_OK{color:var(--cok);border-color:var(--cok)}
.mx .cell.EMPTY_OK{border-style:dashed}
.mx .cell.PARTIAL{color:var(--cwarn);border-color:var(--cwarn);background:var(--warnbg)}
.mx .cell.WRONG,.mx .cell.FP,.mx .cell.FN{color:var(--cerr);border-color:var(--cerr)}
.mx .cell.NA{border-style:dashed}
.mx .cell.none{border-color:transparent}
.mx td.ttl{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx tr.xrow>td{padding:10px;background:var(--c0);border-bottom:1px solid var(--cl)}
.mx .tog{font-family:var(--f-mono);color:var(--ci2);width:18px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fz-3);color:var(--ci2);align-items:center}
.legend .vd{margin-right:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filters label.f{display:flex;gap:6px;align-items:center;font-size:var(--fz-3);color:var(--ci2)}
.filters .c-in{width:auto}
.pager{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:var(--fz-3);color:var(--ci2)}

/* ---------- 23-key table + evidence (style E evidence panel, console colours) ---------- */
.dv{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:10px;align-items:start}
.dv-k{container-type:inline-size}
.k23 td{vertical-align:top}
.k23 tr.kr{cursor:pointer}
.k23 tr.kr:hover td{background:var(--c2)}
.k23 tr.kr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.k23 td.no{width:26px}
.k23 td.lb{white-space:nowrap;font-weight:600;color:var(--ci)}
.k23 tr.off td.lb{color:var(--cd);font-weight:500}
.k23 td.v{min-width:0;width:52%}
.k23 td.v .mono{font-size:var(--fz-2);word-break:break-all}
.k23 td.tg{white-space:nowrap}
@container (max-width:620px){.k23 .kc{display:none}}
.ev-panel{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:hidden}
.dv.inline .ev-panel{position:static;max-height:calc(100vh - 16px)}
.c-tw.fits{overflow:visible}
.c-tw.fits .dv.inline .ev-panel{position:sticky;top:8px}
.ev-tabs{display:flex;gap:2px}
.ev-tabs button{border:1px solid transparent;background:transparent;color:var(--ci2);padding:3px 11px;font-size:var(--fz-4);border-radius:3px}
.ev-tabs button:hover{color:var(--ci)}
.ev-tabs button[aria-selected="true"]{background:var(--c2);color:var(--ca);border-color:var(--cl);font-weight:700}
.ev-prev{border-bottom:1px solid var(--cl);padding:8px 10px;background:var(--c0);display:flex;flex-direction:column;gap:6px;flex-shrink:0;max-height:50vh;overflow:auto}
.ev-prev.min{display:none}
.pv-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pv-h .c-lab{margin:0}
.pv-img{display:block;margin:0 auto;padding:0;border:1px solid var(--cl);background:#000;cursor:zoom-in;max-width:100%}
.pv-img img{display:block;max-height:min(250px,26vh);max-width:100%;object-fit:contain}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.strip.wrap{flex-wrap:wrap;overflow-x:visible}
.fr{flex:0 0 auto;width:112px;border:1px solid var(--cl);background:var(--c1);padding:0;display:flex;flex-direction:column;cursor:zoom-in;color:var(--ci2)}
.fr img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.fr span{font-family:var(--f-mono);font-size:var(--fz-1);padding:1px 4px;text-align:left;white-space:nowrap}
.fr:hover{border-color:var(--ca);color:var(--ca)}
.strip.wrap .fr{width:calc((100% - 18px)/4)}
.fr.pg{width:112px}
.fr.pg .pgw{position:relative;display:block;width:100%;aspect-ratio:1/1.414;background:#fff;overflow:hidden}
.fr.pg .pgw img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:contain;background:#fff}
.fr.pg.sm{width:62px}
.fr.pg.hit{border-color:var(--hlon);box-shadow:0 0 0 1px var(--hlon)}
.fr.pg .pgw,.fr.pg .hlx{padding:0}
/* 원본 위치 표시 — 쪽 위 노란 표시 (정규화 좌표 → %) */
.hlx{position:absolute;inset:0;pointer-events:none}
.hm{position:absolute;display:block;background:var(--hlm);mix-blend-mode:multiply;border-radius:1px;pointer-events:auto;cursor:pointer;transition:opacity .15s}
.hm.pri{background:var(--hlm2)}
.hm.ap{outline:1px dashed var(--hlap);outline-offset:0}
.hlx.foc .hm{opacity:.25}
.hlx .hm.sel{opacity:1;outline:2px solid var(--hlsel);outline-offset:1px}
.hlx .hm.on{opacity:1;background:var(--hlm2);outline:2px solid var(--hlon);outline-offset:1px}
.hlab{position:absolute;left:0;top:var(--lyc);transform:translate(calc(-100% - 12px),-50%);background:var(--hlon);color:#fff;font:700 var(--fz-4)/1.6 var(--f-sans);padding:0 7px;border-radius:2px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 5px rgba(0,0,0,.35);z-index:2;max-width:min(320px,40vw);overflow:hidden;text-overflow:ellipsis}
.hlab::after{content:'';position:absolute;right:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:0;border-left-color:var(--hlon)}
.lbx-fit.nolm .hlab{left:var(--lx);top:var(--ly0);transform:translateY(calc(-100% - 4px))}
.lbx-fit.nolm .hlab.below{top:var(--ly1);transform:translateY(4px)}
.lbx-fit.nolm .hlab::after{display:none}
.hl-w{display:flex;flex-direction:column;gap:3px;min-width:0}
.hl-leg{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;font-size:var(--fz-3);color:var(--ci2);min-width:0}
.hl-leg>span{overflow-wrap:anywhere;min-width:0}
.hl-leg .sw{display:inline-block;width:15px;height:9px;background:var(--hlm2);border-radius:1px;vertical-align:-1px;margin-right:5px}
.hl-leg .sw.ap{background:transparent;outline:1px dashed var(--hlap);outline-offset:-1px}
.hl-leg .hl-src{color:var(--ci)}
.hl-leg .mono{font-size:var(--fz-2)}
.hl-leg .sp{flex:1}
.hl-leg.none{color:var(--ci2)}
.hl-leg.none b{color:var(--ci)}
.hl-leg.err{color:var(--cerr)}
.hl-nf{font-size:var(--fz-3);color:var(--ci2)}
.hl-nf summary{cursor:pointer;width:max-content;max-width:100%}
.hl-nf ul{margin:3px 0 0;padding-left:18px}
.hl-nf li{overflow-wrap:anywhere}
.ev-loc{margin:1px 0 5px;font-size:var(--fz-4);color:var(--ci2)}
.ev-loc .c-lnk{font-size:var(--fz-4);margin:0}
.pgc{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:var(--fz-1);line-height:calc(15px * var(--fs));padding:0 4px;border-radius:2px;background:var(--hlm2);color:var(--hlink);font-weight:700;vertical-align:1px}
.pgc.ap{background:transparent;outline:1px dashed var(--hlap);outline-offset:-1px;color:var(--ci2)}
.ev-body{flex:1;overflow:auto;padding:10px;min-height:140px}
.ev{border-left:3px solid var(--cl);background:var(--c2);padding:7px 10px;margin-bottom:8px;border-radius:0 3px 3px 0}
.ev.on{border-left-color:var(--ca);background:var(--hl);animation:evFlash 1.4s ease-out}
@keyframes evFlash{0%{box-shadow:0 0 0 2px var(--ca)}100%{box-shadow:0 0 0 0 transparent}}
.ev h4{margin:0 0 3px;font-size:var(--fz-5);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev h4 .no{font-family:var(--f-mono);color:var(--cd);font-weight:500}
.ev h4 .src{font-family:var(--f-mono);font-size:var(--fz-1);color:var(--ca);font-weight:500}
.ev p{margin:0 0 4px;color:var(--ci)}
.ev dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 10px;margin:0;font-size:var(--fz-4)}
.ev dt{color:var(--ci2)}
.ev dd{margin:0;overflow-wrap:anywhere;min-width:0}
.ev dd .mono{font-size:var(--fz-2);word-break:break-all}
.ev-miss{border:1px dashed var(--ci2);color:var(--ci2);padding:6px 10px;margin-bottom:8px;font-size:var(--fz-4)}
.ev-sub{font-size:var(--fz-3);color:var(--cd);margin:10px 0 6px;font-weight:700;letter-spacing:.03em}
.cos{height:6px;background:var(--c0);border:1px solid var(--cl);position:relative;margin-top:5px;max-width:260px}
.cos i{position:absolute;left:0;top:0;bottom:0;background:var(--ca)}
.cos u{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--cerr)}
.jbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-10px -10px 8px;padding:8px 10px;position:sticky;top:-10px;background:var(--c1);border-bottom:1px solid var(--cl);z-index:1}
.vdt td{font-size:var(--fz-4)}
.vdt td.det{color:var(--ci2);font-size:var(--fz-3)}
.vdt .det div+div{margin-top:2px}

/* ---------- per-key F1 chart ---------- */
.f1c{--lw:calc(140px * var(--fs));--vw:calc(58px * var(--fs));--g:10px;container-type:inline-size;container-name:f1c;position:relative;display:flex;flex-direction:column;gap:5px;padding-top:20px}
.f1c-row,.f1c-axis{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--vw);gap:var(--g);align-items:center;min-height:22px}
.f1c-row{border-radius:3px}
.f1c-lab{font-size:var(--fz-5);color:var(--f1-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f1c-track{position:relative;height:var(--bh,10px);background:var(--f1-track)}
.f1c-bar{position:absolute;left:0;top:0;bottom:0;background:var(--f1-bar);border-radius:0 3px 3px 0}
.f1c-row:hover .f1c-bar,.f1c-row:focus-visible .f1c-bar{filter:brightness(1.15) saturate(1.1)}
.f1c-val{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:var(--fz-4);text-align:right;color:var(--f1-ink)}
.f1c-val.lo{color:var(--cerr)}
.f1c-row.na .f1c-val{color:var(--f1-ink2);font-family:var(--f-sans);font-size:var(--fz-3)}
.f1c-row.na .f1c-track{background:transparent;border-top:1px dashed var(--f1-axis);height:0}
.f1c-ref{position:absolute;top:2px;bottom:20px;width:0;left:calc(var(--lw) + var(--g) + (100% - var(--lw) - var(--vw) - 2 * var(--g)) * .85);border-left:1.5px solid var(--f1-ref);pointer-events:none;z-index:1}
.f1c-ref span{position:absolute;top:-2px;right:6px;font-size:var(--fz-2);color:var(--f1-ink2);white-space:nowrap}
.f1c-ticks{position:relative;height:18px;border-top:1px solid var(--f1-axis)}
.f1c-ticks i{position:absolute;top:2px;transform:translateX(-50%);font-style:normal;font-size:var(--fz-2);color:var(--f1-ink2);font-variant-numeric:tabular-nums}
.f1c-ticks i:first-child{transform:none}
.f1c-ticks i:last-child{transform:translateX(-100%)}
@container f1c (max-width:430px){.f1c-ticks i:nth-child(2),.f1c-ticks i:nth-child(4){display:none}}

/* ---------- 로그 보기: 수준 색 · 구성요소 배지 · 필터 · 오류/경고 계수 (실행 로그 · 시스템 로그 공용) ---------- */
.c-log .ln{padding-left:2ch;text-indent:-2ch;border-radius:2px}
.c-log .ln *{text-indent:0}
.c-log .ln.cont{padding-left:4ch;text-indent:0;color:var(--ci2)}
.c-log .lvb{display:inline-block;min-width:5ch;color:var(--cok)}
.c-log .L-DEBUG .lvb,.c-log .L-DEBUG .m{color:var(--cd)}
.c-log .L-WARNING{background:var(--warnbg)}
.c-log .L-WARNING .lvb,.c-log .L-WARNING .m,.c-log .L-WARNING.cont{color:var(--cwarn)}
.c-log .L-ERROR,.c-log .L-CRITICAL{background:var(--errbg)}
.c-log .L-ERROR .lvb,.c-log .L-CRITICAL .lvb,.c-log .L-ERROR .m,.c-log .L-CRITICAL .m,.c-log .L-ERROR.cont,.c-log .L-CRITICAL.cont{color:var(--cerr)}
.c-log .L-WARNING .lvb,.c-log .L-ERROR .lvb,.c-log .L-CRITICAL .lvb{font-weight:700}
.c-log .cb{display:inline-block;min-width:4.6em;text-align:center;font-size:var(--fz-1);line-height:calc(16px * var(--fs));padding:0 3px;border:1px solid var(--cl);border-radius:2px;color:var(--ci2);vertical-align:1px}
.c-log .cb.none{border-color:transparent}
.c-log .rid{background:none;border:0;padding:0;font:inherit;color:var(--cd);text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
.c-log .rid:hover{color:var(--ca)}
.c-log mark{background:var(--ca);color:var(--onacc);border-radius:2px;padding:0 1px}
.c-log .ph{color:var(--cd)}
.c-log.sy{height:max(360px,calc(100vh - 262px))}
.logf{margin-bottom:8px}
.lcnt{font-family:var(--f-mono);font-size:var(--fz-2);line-height:calc(19px * var(--fs));padding:0 7px;border:1px solid var(--cl);border-radius:2px;background:transparent;color:var(--cd);display:inline-flex;gap:2px;align-items:center;white-space:nowrap}
.lcnt b{font-weight:700;margin-left:3px}
.lcnt.err.on{border-color:var(--cerr);color:var(--cerr)}
.lcnt.warn.on{border-color:var(--cwarn);color:var(--cwarn)}
button.lcnt[aria-pressed="true"]{background:var(--c2);box-shadow:inset 0 -2px 0 currentColor}
.lasterr{margin-top:10px;border-left:3px solid var(--cerr);background:var(--errbg);padding:5px 9px;font-size:var(--fz-4);color:var(--ci);border-radius:0 3px 3px 0}
.lasterr b{color:var(--cerr)}
.lasterr .mono{font-size:var(--fz-2);word-break:break-all}

/* ---------- 통합 검증 탭 (중재자 결정) ---------- */
.cons{container-type:inline-size;container-name:cons}
.c-reads.cmp{grid-template-columns:repeat(auto-fit,minmax(calc(120px * var(--fs)),1fr))}
.c-read .v.xs{font-size:var(--fz-5);line-height:1.45;white-space:normal;overflow-wrap:anywhere;color:var(--ci);padding-top:5px}
.dsum{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:8px;font-size:var(--fz-3);color:var(--ci2)}
.dsum .chip{margin:0}
.dflags{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-top:8px;font-size:var(--fz-4);color:var(--ci2)}
.dflags .mono{font-size:var(--fz-2);overflow-wrap:anywhere}
.c-tag.warn{border-color:var(--cwarn);color:var(--cwarn);background:var(--warnbg)}
.dec{display:inline-block;font-family:var(--f-sans);font-size:var(--fz-2);font-weight:700;line-height:calc(17px * var(--fs));padding:0 6px;border:1px solid var(--cl);border-radius:2px;white-space:nowrap;color:var(--ci2)}
.dec.AGREED{color:var(--cok);border-color:var(--cok)}
.dec.CONFLICT{color:var(--cwarn);border-color:var(--cwarn);background:var(--warnbg)}
.dec.LLM_ONLY{color:var(--ci);border-color:var(--ci2)}
.dec.NER_ONLY{color:var(--cinfo);border-color:var(--cinfo)}
.dec.MISSING{color:var(--cd);border-style:dashed}
.cfil{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:8px}
.fchip{font-family:var(--f-sans);font-size:var(--fz-3);line-height:calc(19px * var(--fs));padding:1px 9px;border:1px solid var(--cl);border-radius:11px;background:var(--c2);color:var(--ci2);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.fchip .mono{font-size:var(--fz-2);color:inherit}
.fchip:hover{border-color:var(--ci2)}
.fchip[aria-pressed="true"]{background:var(--ca);border-color:var(--ca);color:var(--onacc);font-weight:700}
.fchip:disabled{opacity:.42;cursor:default}
.fchip i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid currentColor}
.fchip.AGREED i{background:var(--cok);border-color:var(--cok)} .fchip.CONFLICT i{background:var(--cwarn);border-color:var(--cwarn)} .fchip.NER_ONLY i{background:var(--cinfo);border-color:var(--cinfo)} .fchip.LLM_ONLY i{background:var(--ci2);border-color:var(--ci2)} .fchip.MISSING i{border-style:dashed}
.nerl{border-left:3px solid var(--cok);background:var(--c2);padding:7px 10px;margin-top:10px;border-radius:0 3px 3px 0;font-size:var(--fz-4);overflow-wrap:anywhere}
.nerl.fb{border-left-color:var(--cwarn);background:var(--warnbg)}
.nerl.off{border-left-color:var(--cl)}
.nerl .mono{font-size:var(--fz-2)}
.nerl .nerr{margin-top:4px;color:var(--cerr);font-family:var(--f-mono);font-size:var(--fz-2);word-break:break-all}
.nerl details{margin-top:5px}
.nerl summary{cursor:pointer;color:var(--ci2);font-size:var(--fz-3)}
.nerl .nerc{margin-top:5px}
.chip .et{color:var(--cd);margin-right:5px}
.vel{margin:0;padding-left:18px;font-size:var(--fz-3);color:var(--cwarn)}
.vel li{overflow-wrap:anywhere}
.cdt{table-layout:fixed}
.cdt td.cv .mono{font-size:var(--fz-2);word-break:break-all}
.cdt td.fin{color:var(--ci)}
.cdt td.fin .clamp{font-weight:600}
.cdt .cfn{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;min-width:0}
.cdt .cfn b{font-weight:600;color:var(--ci);overflow-wrap:anywhere}
.cdt .cfk{font-size:var(--fz-1);overflow-wrap:anywhere}
.k23b{font-family:var(--f-mono);font-size:var(--fz-1);color:var(--onacc);background:var(--ca);border-radius:2px;padding:0 4px;line-height:calc(16px * var(--fs));font-weight:700;white-space:nowrap}
.cdt tr.cd.lk{cursor:pointer}
.cdt tr.cd.lk:hover td,.cdt tr.cd.lk:hover+tr.cr td{background:var(--c2)}
.cdt tr.cd.lk:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.cdt tr.cd.hr td{border-bottom:0;padding-bottom:1px}
.cdt tr.cr td{color:var(--ci2);font-size:var(--fz-3);padding-top:0;padding-bottom:6px;border-bottom:1px solid var(--cl)}
.cdt tr.cr .crl{font-size:var(--fz-1);color:var(--cd);margin-right:6px}
.cdt td.cdc{white-space:nowrap}
.cbar{height:5px;background:var(--c0);border:1px solid var(--cl);position:relative;margin-top:5px;max-width:84px}
.cbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ca)}
.cbv{font-size:var(--fz-1);color:var(--ci2)}
.clamp.cut{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.clamp.cut.open{display:inline;-webkit-line-clamp:unset}
.c-lnk{background:none;border:0;padding:0;margin-left:4px;color:var(--ca);font-size:var(--fz-2);text-decoration:underline;text-underline-offset:2px;font-family:var(--f-sans)}
.k23 tr.kr.flash td{animation:rowFlash 1.6s ease-out}
@keyframes rowFlash{0%{background:var(--hl);box-shadow:inset 0 2px 0 var(--ca),inset 0 -2px 0 var(--ca)}100%{box-shadow:inset 0 0 0 transparent}}
@container cons (max-width:560px){
  .cdt,.cdt tbody{display:block}
  .cdt colgroup,.cdt thead{display:none}
  .cdt tr.cd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .cdt tr.cd td{display:block;border-bottom:0;padding:3px 5px}
  .cdt tr.cd td.cf{grid-column:1/3;grid-row:1}
  .cdt tr.cd td.cdc{grid-column:3;grid-row:1;text-align:right}
  .cdt tr.cd td.cdc .cbar{margin-left:auto}
  .cdt tr.cd td.cv{grid-row:2}
  .cdt tr.cd td.cv::before{content:attr(data-l);display:block;font:var(--fz-1)/1.4 var(--f-sans);color:var(--cd)}
  .cdt tr.cd:not(.hr){border-bottom:1px solid var(--cl)}
  .cdt tr.cr,.cdt tr.cr td{display:block}
  .cdt .cbv::before{content:'신뢰도 '}
}

/* ---------- overlays ---------- */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tipbg);color:var(--tipink);padding:8px 14px;border-radius:4px;font-size:var(--fz-6);z-index:120;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.err{background:var(--cerr);color:#fff}
#tip{position:fixed;z-index:130;pointer-events:none;background:var(--tipbg);color:var(--tipink);padding:6px 9px;border-radius:4px;font-size:var(--fz-4);line-height:1.4;max-width:calc(280px * var(--fs));box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{display:block;font-size:var(--fz-8);font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.lbx{position:fixed;inset:0;z-index:110;background:rgba(5,7,9,.9);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:14px 16px;gap:10px}
.lbx-top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#e6e9ec;font-family:var(--f-mono);font-size:var(--fz-5)}
.lbx-stage{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.lbx-stage img{width:100%;height:100%;object-fit:contain;background:transparent}
.lbx-fit{position:relative;width:100%;height:100%}
.lbx-fit.pg{width:auto;height:auto;flex:0 0 auto;background:#fff}
.lbx-fit.pg img{display:block;width:100%;height:100%;object-fit:fill;background:#fff}
.lbx-top .lbx-tools{display:flex;gap:8px;align-items:center;flex-shrink:0}
.lbx-nav{display:flex;justify-content:center;gap:8px;align-items:center;color:#c9ced3;font-family:var(--f-mono);font-size:var(--fz-4)}
.lbx .c-btn{background:#171c22;border-color:#3a434d;color:#e6e9ec}
.lbx .c-btn:hover{border-color:#8f9baa}
.lbx-strip{display:flex;gap:4px;overflow-x:auto;max-width:min(100%,1100px)}
.lbx-strip button{flex:0 0 auto;width:64px;padding:0;border:1px solid #3a434d;background:#000;opacity:.6}
.lbx-strip button[aria-current="true"]{opacity:1;border-color:#f5a524}
.lbx-strip img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}

/* ---------- 폴더로 시험 · 폴더 고르기 창 ---------- */
.bmode{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:10px}
.bmode .t{font-weight:700;color:var(--ci)}
.fsec{margin-bottom:12px}
.fdir{display:flex;gap:6px;align-items:center;margin-bottom:5px;min-width:0}
.fdir .c-in{flex:1 1 auto;min-width:0}
.fans{border:1px solid var(--cl);background:var(--c2);padding:8px 10px;border-radius:3px;margin-bottom:8px}
.fans h5{margin:0 0 6px;font-size:var(--fz-4);color:var(--ci)}
.fans .c-radio label{background:var(--c1)}
.fblk{border-top:1px solid var(--cl);padding-top:12px;margin-top:12px}
.fblk:first-of-type{border-top:0;padding-top:0;margin-top:0}
.fscan-t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0 0 8px}
.fscan-t b{font-size:var(--fz-7)}
.fiss{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-size:var(--fz-4)}
.fiss summary{cursor:pointer;width:max-content;max-width:100%}
.fiss ul{margin:4px 0 0;padding-left:20px;color:var(--ci2);font-size:var(--fz-3);max-height:180px;overflow:auto}
.fiss li{overflow-wrap:anywhere}
.fbx{position:fixed;inset:0;z-index:115;background:var(--shade);display:grid;place-items:center;padding:16px}
.fbx-card{background:var(--c1);border:1px solid var(--cl);width:min(760px,100%);max-height:min(720px,calc(100vh - 32px));display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.fbx-path{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--cl);flex-wrap:wrap}
.fbx-path .c-in{flex:1 1 260px;min-width:0}
.fbx-roots{display:flex;gap:4px;flex-wrap:wrap}
.fbx-body{overflow:auto;padding:8px 10px;flex:1;min-height:180px}
.fbx-list{display:flex;flex-direction:column;gap:1px}
.fbx-it{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--ci);padding:5px 8px;border-radius:3px;font-size:var(--fz-5)}
.fbx-it:hover{background:var(--c2);border-color:var(--cl)}
.fbx-it svg{color:var(--ca);flex-shrink:0}
.fbx-it span{overflow-wrap:anywhere}
.fbx-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--cl);flex-wrap:wrap}
.fbx-cnt{margin-right:auto}

/* ---------- 추출 및 검증 — 두 시험 개요 · 완료 화면 (절차서 4~5단계) ---------- */
.done-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.done-h .big{font-size:var(--fz-8);font-weight:700;color:var(--ci)}
.tcard .c-pb{display:flex;flex-direction:column;gap:10px}
.tcard dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:var(--fz-4)}
.tcard dt{color:var(--cd)} .tcard dd{margin:0;font-family:var(--f-mono);color:var(--ci);overflow-wrap:anywhere}
.tcard dd .path{font-size:var(--fz-2);color:var(--ci2);margin-top:2px}
.tcard .go{font-size:var(--fz-6);padding:9px 14px;justify-content:center}
.tcard .row{display:flex;gap:6px;flex-wrap:wrap}
.c-t tr.tot td{font-weight:700;border-top:1px solid var(--cl)}

@media (max-width:1180px){.c-grid>.c-s4,.c-grid>.c-s5,.c-grid>.c-s7,.c-grid>.c-s8,.c-grid>.c-s6,.c-grid>.c-s3{grid-column:1/-1}.dv{grid-template-columns:minmax(0,1fr)}.ev-panel{position:static;max-height:none}.c-form{grid-template-columns:calc(96px * var(--fs)) minmax(0,1fr)}}
</style>
{% endraw %}

  const o = {credentials:'same-origin', headers:{Accept:'application/json'}, method: opt.method || 'GET'};
  if(opt.json !== undefined){ o.method = opt.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opt.json); }
  else if(opt.body) o.body = opt.body;
  let r;
  try{ r = await fetch('/api/test' + path, o); }catch(e){ throw new ApiError(0, null, errText(0, null)); }
  let data = null; const txt = await r.text();
  if(txt){ try{ data = JSON.parse(txt); }catch(e){ data = {message: txt.slice(0, 300)}; } }
  handleStatusSide(r.status, data);
  if(!r.ok) throw new ApiError(r.status, data, errText(r.status, data));
  return data;
}
async function apiText(path){
  let r; try{ r = await fetch('/api/test' + path, {credentials:'same-origin'}); }catch(e){ throw new ApiError(0, null, errText(0, null)); }
  if(!r.ok){ let d = null; try{ d = await r.json(); }catch(e){} handleStatusSide(r.status, d); throw new ApiError(r.status, d, errText(r.status, d)); }
  return r.text();
}
function uploadForm(path, fd, onProgress){
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', '/api/test' + path); x.withCredentials = true; x.setRequestHeader('Accept', 'application/json');
    x.upload.onprogress = e => { if(e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onerror = () => reject(new ApiError(0, null, errText(0, null)));
    x.onload = () => { let d = null; try{ d = x.responseText ? JSON.parse(x.responseText) : null; }catch(e){ d = {message: (x.responseText || '').slice(0, 300)}; }
      handleStatusSide(x.status, d);
      if(x.status >= 200 && x.status < 300) resolve(d); else reject(new ApiError(x.status, d, errText(x.status, d))); };
    x.send(fd);
  });
}

/* ---------- SSE (resumable with ?after=seq) ---------- */
class RunStream{
  constructor(runId, onEvent, onEnd){ this.runId = runId; this.seq = 0; this.onEvent = onEvent; this.onEnd = onEnd; this.closed = false; this.fails = 0; this.open(); }
  open(){
    if(this.closed) return;
    const es = new EventSource('/api/test' + runPath(this.runId) + '/stream?after=' + this.seq);
    this.es = es;
    es.onopen = () => { this.fails = 0; };
    es.onmessage = e => {
      let ev; try{ ev = JSON.parse(e.data); }catch(_){ return; }
      if(isNum(ev.seq)){ if(ev.seq <= this.seq && ev.type !== 'closed') return; this.seq = ev.seq; }
      try{ this.onEvent(ev); }catch(err){ console.warn('event handler', err); }
      if(ev.type === 'closed') this.finish(ev);
    };
    es.onerror = () => { es.close(); if(this.closed) return; this.fails++; setTimeout(() => this.check(), Math.min(10000, 800 * Math.pow(1.7, this.fails))); };
  }
  async check(){
    if(this.closed) return;
    try{
      const run = await api(runPath(this.runId));
      if(TERMINAL.has(run.state) && this.fails >= 2){ this.finish({type:'closed', state: run.state, synthetic: true}); return; }
      this.open();
    }catch(e){
      if(e.status === 404){ this.finish({type:'closed', state:'missing', synthetic:true}); return; }
      if(e.status === 401) return;
      setTimeout(() => this.check(), Math.min(15000, 1000 * Math.pow(1.7, this.fails++)));
    }
  }
  finish(ev){ if(this.closed) return; this.closed = true; if(this.es) this.es.close(); if(this.onEnd) this.onEnd(ev); }
  close(){ this.closed = true; if(this.es) this.es.close(); }
}

const SCREENS = ['single','batch','progress','results','history','syslog'];
function go(scr, opts){
  opts = opts || {};
  if(!SCREENS.includes(scr)) scr = 'single';
  S.screen = scr;
  SCREENS.forEach(s => { $('#scr-' + s).hidden = s !== scr; const b = $('#nav-' + s); if(s === scr) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if(!opts.noHash) writeHash();
  if(scr === 'single') renderSingle();
  if(scr === 'batch'){ renderBatch(); if(S.batch.inited && !S.batch.est && !S.batch.estLoading) refreshEstimate(); }
  if(scr === 'progress') enterProgress();
  if(scr === 'results') enterResults();
  if(scr === 'history') loadHistory();
  if(scr === 'syslog') enterSyslog(); else stopSyslog();
  if(!opts.keepScroll) window.scrollTo(0, 0);
}
function writeHash(){
  let h = '#' + S.screen;
  if(S.screen === 'progress' && S.prog && S.prog.runId) h += '/' + S.prog.runId + (S.prog.view === 'run' && isFolderRun(S.prog.run) ? '/run' : '');
  if(S.screen === 'results' && S.res.runId) h += '/' + S.res.runId;
  if(S.screen === 'single' && S.single.runId) h += '/' + S.single.runId;
  if(location.hash !== h) history.replaceState(null, '', h);
}
function readHash(){ const m = (location.hash || '').slice(1).split('/'); return {screen: SCREENS.includes(m[0]) ? m[0] : null, id: m[1] ? decodeURIComponent(m[1]) : null, sub: m[2] || null}; }

async function startBatch(confirmed){
  const B = S.batch, v = estView();
  if(!confirmed){ B.confirm = true; patchEstimate(); const g = $('#bGo'); if(g) g.focus(); return; }
  const body = {test: B.test, source: B.source, sample: B.sample, workers: Math.max(1, Math.round(+B.workers || defWorkers(B.test))), tau: +(+B.tau).toFixed(2), only_predicted: !!B.onlyPred, title_fallback: B.test === 'T-002' && !!B.titleFallback, consolidate_work: B.test === 'T-002' && !!B.consWork};
  if(B.source === 'ids'){ body.ids = parseIds(); if(!body.ids.length){ B.err = '세트 ID를 하나 이상 입력하세요.'; B.confirm = false; patchEstimate(); return; } }
  else body.cells = B.cells.slice();
  const n = nSets(); if(n) body.n = n;
  if(B.sample === 'random' && String(B.seed).trim() !== '') body.seed = Math.round(+B.seed);
  if(String(B.maxCost).trim() !== '' && isNum(+B.maxCost)) body.max_cost = +B.maxCost;
  if(B.name.trim()) body.name = B.name.trim();
  B.busy = true; B.err = null; B.busyActive = null; patchEstimate();
  try{
    const r = await api('/batch', {json: body});
    B.busy = false; B.confirm = false; patchEstimate();
    toast(`일괄 시험을 시작했습니다 · ${nf(r.n_sets)}세트`);
    openProgress(r.run_id, {fresh: true, nSets: r.n_sets, estimate: r.estimate});
    loadStatus();
  }catch(e){ B.busy = false; B.confirm = false; B.err = e.message; if(e.status === 409 && e.data && e.data.active) B.busyActive = e.data.active; patchEstimate(); toast(e.message, true); }
}

function newProg(runId){ return {runId, view:'auto', run:null, rows:new Map(), order:[], log:[], stream:null, follow:true, failOnly:false, total:null, done:0, failed:0, cost:null, state:null, err:null, finalized:null, cancelArmed:false, loadErr:null, startedMs:null, finishedMs:null, logNote:null, lf:{lv:'', comp:'', set:'', q:''}, nErr:0, nWarn:0, logSets:new Set(), logComps:new Set(), domLines:0}; }
function openProgress(runId, opts){
  opts = opts || {};
  if(S.prog && S.prog.runId === runId && !opts.fresh){ if(opts.view) S.prog.view = opts.view; go('progress'); return; }
  if(S.prog && S.prog.stream) S.prog.stream.close();
  S.prog = newProg(runId);
  if(opts.view) S.prog.view = opts.view;
  if(opts.nSets) S.prog.total = opts.nSets;
  go('progress');
  loadProgressRun();
}
async function loadProgressRun(){
  const P = S.prog; if(!P) return; const rid = P.runId;
  try{
    const run = await api(runPath(rid)); if(S.prog !== P) return;
    applyRun(P, run);
    if(P.view === 'auto') P.view = isFolderRun(run) ? 'overview' : 'run';
    if(S.screen === 'progress') writeHash();
    if(P.view === 'overview') ovStart(run);
    if(TERMINAL.has(run.state)){ await loadFinishedRows(P); }
    else if(!P.stream){ P.stream = new RunStream(rid, ev => { if(S.prog === P) onProgEvent(P, ev); }, ev => { if(S.prog === P) progClosed(P, ev); }); }
  }catch(e){ if(S.prog !== P) return; P.loadErr = e.message; }
  scheduleProg(true);
}
function applyRun(P, run){
  P.run = run; P.state = run.state; const pr = run.progress || {};
  if(isNum(pr.total)) P.total = pr.total; else if(isNum(run.n_sets)) P.total = run.n_sets;
  if(isNum(pr.i)) P.done = Math.max(P.done, pr.i); else if(isNum(run.done)) P.done = Math.max(P.done, run.done);
  if(isNum(pr.failed)) P.failed = Math.max(P.failed, pr.failed); else if(isNum(run.failed)) P.failed = Math.max(P.failed, run.failed);
  if(isNum(pr.cost_krw_total)) P.cost = pr.cost_krw_total; else if(isNum(run.cost_krw)) P.cost = run.cost_krw;
  P.startedMs = toMs(run.started_at) || toMs(run.created_at); P.finishedMs = toMs(run.finished_at);
  if(run.error) P.err = scrub(run.error);
}
async function loadFinishedRows(P){
  try{
    const r = await api(runPath(P.runId) + '/sets?limit=5000'); if(S.prog !== P) return;
    (r.items || []).forEach(it => { P.rows.set(it.set_id, {id: it.set_id, cell: it.cell, media: it.media, title: it.title, st: it.state === 'pending' ? 'wait' : (it.ok === false ? 'bad' : 'ok'), el: it.elapsed_sec, cost: it.cost_krw, err: it.error, att: it.attempts}); if(!P.order.includes(it.set_id)) P.order.push(it.set_id); });
  }catch(e){ if(e.status !== 404) P.loadErr = e.message; }
  try{ const t = await apiText(runPath(P.runId) + '/download/test.log'); if(S.prog !== P) return; const lines = t.split(/\r?\n/).filter(Boolean); P.log = []; P.nErr = 0; P.nWarn = 0; lines.forEach(l => pushRunLog(P, l, null)); P.logNote = lines.length > RUNLOG_CAP ? `앞의 ${nf(lines.length - RUNLOG_CAP)}줄 생략 (오류·경고 계수는 전체 기준)` : null; }

function rowFor(P, id){ let r = P.rows.get(id); if(!r){ r = {id, st: 'run', t0: Date.now()}; P.rows.set(id, r); P.order.push(id); } return r; }
function onProgEvent(P, ev){
  const t = ev.type;
  if(t === 'start'){ if(isNum(ev.total)) P.total = ev.total; }
  else if(t === 'set_start'){ const r = rowFor(P, ev.set_id); Object.assign(r, {st: 'run', t0: toMs(ev.ts) || Date.now()}); ['cell','media','title'].forEach(k => { if(ev[k] != null) r[k] = ev[k]; }); }
  else if(t === 'set_done'){ const r = rowFor(P, ev.set_id); r.st = ev.ok === false ? 'bad' : 'ok'; r.el = ev.elapsed_sec; r.cost = ev.cost_krw; r.err = ev.error; ['cell','media','title'].forEach(k => { if(ev[k] != null) r[k] = ev[k]; }); }
  else if(t === 'progress'){ if(isNum(ev.i)) P.done = Math.max(P.done, ev.i); if(isNum(ev.total)) P.total = ev.total; if(isNum(ev.failed)) P.failed = ev.failed; if(isNum(ev.cost_krw_total)) P.cost = ev.cost_krw_total;
    if(ev.set_id){ const r = rowFor(P, ev.set_id); if(r.st === 'run'){ r.st = ev.ok === false ? 'bad' : 'ok'; if(isNum(ev.elapsed_sec)) r.el = ev.elapsed_sec; if(ev.error) r.err = ev.error; } } }
  else if(t === 'log'){ const line = fv(ev, 'line', 'text', 'message', 'msg'); if(line != null){ const o = pushRunLog(P, line, ev); logToRows(P, o); appendLog(o); } }
  else if(t === 'state'){ P.state = ev.state; if(ev.state === 'running' && !P.startedMs) P.startedMs = toMs(ev.ts) || Date.now(); if(ev.error) P.err = scrub(ev.error); }
  else if(t === 'finalized'){ P.finalized = ev; }
  else if(t === 'error'){ P.err = scrub(ev.error || ev.message || '오류'); }
  else if(t === 'cost_limit'){ P.err = `비용 상한에 도달해 멈췄습니다 (${won(ev.cost_krw)} / 상한 ${won(ev.limit)})`; }
  scheduleProg(false);
}
/* 실행 로그 한 줄 → 버퍼(최근 3,000줄) · 오류/경고 계수 · 세트 목록 */
function pushRunLog(P, raw, ev){
  const o = inheritLog(parseLog(raw, ev), P.log[P.log.length - 1]);
  if(!o.cont){ if(lvRank(o.lv) >= 40){ P.nErr++; P.lastErr = o; } else if(o.lv === 'WARNING') P.nWarn++; }
  if(o.set) P.logSets.add(o.set);
  if(o.comp && !COMPS.includes(o.comp)) P.logComps.add(o.comp);
  P.log.push(o); if(P.log.length > RUNLOG_CAP) P.log.splice(0, P.log.length - RUNLOG_CAP);

}
function logToRows(P, o){

  let m = msg.match(/^시작 —(.*)$/);
  if(m){ const r = rowFor(P, sid); if(!r.t0) r.t0 = (o.date && o.ts ? toMs(o.date + ' ' + o.ts) : null) || Date.now(); const md = m[1].match(/media=(\w+)/); if(md && !r.media) r.media = md[1]; return; }
  m = msg.match(/^종료 — (OK|FAIL) · ([\d.]+)s(?:.*?₩([\d.]+))?(?: · (.*))?/);
  if(m){ const r = rowFor(P, sid); if(r.st === 'run'){ r.st = m[1] === 'OK' ? 'ok' : 'bad'; } if(!isNum(r.el)) r.el = +m[2]; if(m[3] && !isNum(r.cost)) r.cost = +m[3]; if(m[1] === 'FAIL' && !r.err) r.err = m[4] || '실패'; }
}

  const okRows = [...P.rows.values()].filter(r => r.st === 'ok' && isNum(r.el));
  const avg = okRows.length ? okRows.reduce((a, r) => a + r.el, 0) / okRows.length : null;
  const frac = tot ? done / tot : 0, eta = tot && done && el && !TERMINAL.has(P.state) ? el / done * (tot - done) : null;
  const st = P.state || run.state, cls = st === 'done' ? 'ok' : (st === 'error' || st === 'interrupted') ? 'err' : st === 'cancelled' ? 'err' : '';

    <div class="c-read"><div class="l">경과</div><div class="v" id="pEl">${clock(el)}</div><div class="s">${eta != null ? '남은 시간 약 ' + dur(eta) : run.started_at ? '시작 ' + fmtWhen(run.started_at, true) : ''}</div></div>

    ${P.err ? `<div class="banner" style="margin-top:10px"><b>알림</b><span>${esc(P.err)}</span></div>` : ''}${P.loadErr ? `<p class="msg err" style="margin-top:8px">${esc(P.loadErr)}</p>` : ''}`, done, tot};

   화면이 보이는 동안만 3초마다 새 기록을 가져온다. 필터는 브라우저에서 건다(바로 반영 · 계수는 늘 받은 기록 전체 기준).

const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  o.run = it.run_id && it.run_id !== '-' ? String(it.run_id) : '';

  o.seq = it.seq != null && isNum(+it.seq) ? +it.seq : null;
  const sm = typeof it.ts === 'string' ? it.ts.match(/^(\d{4}-\d\d-\d\d)/) : null, ms = toMs(it.ts);
  const day = sm ? sm[1] : ms != null ? ymd(new Date(ms)) : '';
  if(day && day !== ymd(new Date()) && o.ts) o.ts = day.slice(5) + ' ' + o.ts;      // 오늘이 아니면 월-일도 보인다

/* 받은 기록 반영 → 'restart'(서버 재시작으로 번호가 처음부터) · 'more'(한 번에 다 못 받음) · '' */
function syIngest(r){
  const items = Array.isArray(r && r.items) ? r.items : [];
  const ls = r && r.last_seq != null && isNum(+r.last_seq) ? +r.last_seq : null;
  if(ls != null && ls < SY.lastSeq){
    SY.lastSeq = 0; SY.floor = 0;
    const o = parseLog('— 서버가 다시 시작되어 시스템 로그 번호가 처음부터 다시 매겨졌습니다 —', {level: 'WARNING', component: '시스템', ts: Date.now()});
    o.seq = null; SY.items.push(o); SY.nWarn++;
    syAppend([o]);
    return 'restart';
  }
  const fresh = [];
  let mx = SY.lastSeq;
  items.forEach(it => { const o = syParse(it); if(o.seq != null){ if(o.seq <= SY.lastSeq || o.seq <= SY.floor) return; mx = Math.max(mx, o.seq); } fresh.push(o); });
  SY.lastSeq = Math.max(mx, ls != null ? ls : 0);
  if(fresh.length){
    fresh.forEach(o => { if(lvRank(o.lv) >= 40) SY.nErr++; else if(o.lv === 'WARNING') SY.nWarn++; if(o.set) SY.sets.add(o.set); if(o.comp) SY.comps.add(o.comp); });
    SY.items.push(...fresh);
    if(SY.items.length > SYSLOG_CAP) SY.items.splice(0, SY.items.length - SYSLOG_CAP);
    syAppend(fresh);
  }
  return (r && (r.more || r.has_more)) || items.length >= 1000 ? 'more' : '';
}
function syAppend(fresh){
  const lg = $('#syLog'); if(!lg || S.screen !== 'syslog') return;
  const add = fresh.filter(o => logMatch(o, SY.f));
  if(add.length){
    if(lg.querySelector('.ph')) lg.innerHTML = '';
    lg.insertAdjacentHTML('beforeend', add.map(o => logLineHTML(o, SY.f.q)).join(''));
    let extra = lg.childElementCount - SYSLOG_CAP; while(extra-- > 0 && lg.firstElementChild) lg.firstElementChild.remove();
    SY.shown = Math.min(SYSLOG_CAP, SY.shown + add.length);
    if(SY.follow) lg.scrollTop = lg.scrollHeight;
  }
  const f = $('#syF'), sn = SY.sets.size + SY.comps.size;
  if(f && SY._fsN !== sn && !f.contains(document.activeElement)){ SY._fsN = sn; f.innerHTML = logFilterHTML('sy', SY.f, [...SY.sets], [...SY.comps]); }
}

async function syPoll(){
  clearTimeout(SY.timer); SY.timer = null;
  if(S.screen !== 'syslog' || SY.paused || SY.missing || SY.busy || document.visibilityState === 'hidden') return;
  const my = ++SY.gen; SY.busy = true;
  let res = null, err = null;
  try{ res = await api('/syslog?after=' + enc(String(SY.lastSeq))); }catch(e){ err = e; }
  if(my !== SY.gen) return;
  SY.busy = false;
  if(err && err.status === 401) return;                 // api() 가 로그인 화면으로 보낸다
  const wasMissing = SY.missing; let next = 3000;
  if(err){
    if(err.status === 404){ SY.missing = true; SY.err = null; }
    else { SY.err = err.message; SY.fails++; next = Math.min(30000, 3000 * Math.pow(1.6, SY.fails)); }
  } else {
    SY.err = null; SY.fails = 0; SY.lastOk = Date.now();
    const k = syIngest(res || {}); if(k) next = 150;
  }

  if(wasMissing !== SY.missing) renderSyslog(); else syPatchHead();

}

    case 'f-tau': { let v = +t.value; if(!isNum(v)) v = 0.65; S.fold.tau = Math.max(0, Math.min(1, v)); t.value = (+S.fold.tau).toFixed(2); return; }
    case 'p-fail': if(S.prog){ S.prog.failOnly = t.checked; scheduleProg(false); } return;
    case 'p-follow': if(S.prog){ S.prog.follow = t.checked; const lg = $('#pLog'); if(t.checked && lg) lg.scrollTop = lg.scrollHeight; } return;
    case 'pl-lv': case 'pl-comp': case 'pl-set': if(S.prog){ S.prog.lf[b.slice(3)] = t.value; rerenderRunLog(); } return;
    case 'sy-lv': case 'sy-comp': case 'sy-set': SY.f[b.slice(3)] = t.value; syRerender(); return;
    case 'sy-follow': { SY.follow = t.checked; const lg = $('#syLog'); if(t.checked && lg) lg.scrollTop = lg.scrollHeight; return; }
    case 'r-run': openResults(t.value); return;
    case 'rf-cell': R.filters.cell = t.value; break;
    case 'rf-key': R.filters.key = t.value; break;
    case 'rf-vd': R.filters.verdict = t.value; break;
    case 'rf-fail': R.filters.failed = t.checked; break;
    default: return;
  }
  if(b.startsWith('rf-')){ R.offset = 0; R.open = null; const f = $('#rFilters'); if(f) restoreFocus(f, () => { f.innerHTML = filtersHTML(); }); loadSets(); }
});
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset && t.dataset.bind; if(!b) return;
  const B = S.batch;
  if(b === 'b-n'){ const v = Math.round(+t.value); if(v > 0){ B.n = Math.min(v, cellTotal() || v); B.confirm = false; refreshEstimate(); } }
  else if(b === 'b-workers'){ const v = Math.round(+t.value); if(v > 0){ B.workers = Math.min(maxW(), v); patchEstimate(); } }
  else if(b === 'b-tau'){ const v = +t.value; if(isNum(v) && t.value !== '') B.tau = Math.max(0, Math.min(1, v)); }
  else if(b === 'b-seed') B.seed = t.value;
  else if(b === 'b-max'){ B.maxCost = t.value; patchEstimate(); }
  else if(b === 'b-name') B.name = t.value;
  else if(b === 'f-dir'){ const L = t.dataset.k === 'c' ? S.fold.cdirs : S.fold.wdirs; L[+t.dataset.i] = t.value; fStale(); }
  else if(b === 'f-apath'){ S.fold.ans[t.dataset.t].path = t.value; fStale(); }
  else if(b === 'f-max') S.fold.maxCost = t.value;
  else if(b === 'f-name') S.fold.name = t.value;
  else if(b === 'b-ids'){ B.ids = t.value; B.n = parseIds().length; const h = t.closest('.c-panel').querySelector('.c-ph b'); if(h) h.textContent = nf(B.n); const n = $('#bN'); if(n){ n.value = B.n; n.max = B.n; } B.confirm = false; refreshEstimate(); }
  else if(b === 'rf-q'){ S.res.filters.q = t.value; clearTimeout(qTimer); qTimer = setTimeout(() => { S.res.offset = 0; S.res.open = null; loadSets(); }, 300); }
  else if(b === 'pl-q'){ if(S.prog) S.prog.lf.q = t.value; clearTimeout(lqTimer); lqTimer = setTimeout(rerenderRunLog, 200); }
  else if(b === 'sy-q'){ SY.f.q = t.value; clearTimeout(lqTimer); lqTimer = setTimeout(syRerender, 200); }
});
/* drag & drop upload */
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('.drop'); if(z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('.drop'); if(z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('.drop'); if(!z) return; e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) setSingleFile(z.dataset.drop, f); });
window.addEventListener('dragover', e => { if(!(e.target.closest && e.target.closest('.drop'))) e.preventDefault(); });
window.addEventListener('drop', e => { if(!(e.target.closest && e.target.closest('.drop'))) e.preventDefault(); });
/* log follow: scrolling up pauses following */
document.addEventListener('scroll', e => {
  const el = e.target; if(!el || (el.id !== 'pLog' && el.id !== 'syLog')) return;
  const atB = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  if(el.id === 'pLog' && S.prog){ if(S.prog.follow !== atB){ S.prog.follow = atB; const c = $('#pFollow'); if(c) c.checked = atB; } }
  else if(el.id === 'syLog'){ if(SY.follow !== atB){ SY.follow = atB; const c = $('#syFollow'); if(c) c.checked = atB; } }
}, true);
/* chart tooltip (hover and keyboard focus) */
const tip = $('#tip');
function showTip(el, x, y){ tip.querySelector('b').textContent = el.dataset.tipv; tip.querySelector('span').textContent = el.dataset.tipl; tip.hidden = false; const r = tip.getBoundingClientRect(); let L = x + 14, T = y + 14; if(L + r.width > innerWidth - 8) L = x - r.width - 14; if(T + r.height > innerHeight - 8) T = y - r.height - 14; tip.style.left = Math.max(8, L) + 'px'; tip.style.top = Math.max(8, T) + 'px'; }
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tipv]'); if(el) showTip(el, e.clientX, e.clientY); else if(!tip.hidden && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.tipv)) tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tipv]'); if(el){ const r = el.getBoundingClientRect(); showTip(el, r.left + r.width * 0.55, r.bottom - 2); } });
document.addEventListener('focusout', () => { tip.hidden = true; });
/* 원본 위치: 항목 행 · 통합 검증 행 · 근거 블록에 마우스(또는 키보드 초점)가 오면 그 값의 표시를 강조하고 그 쪽으로 미리보기를 옮긴다 */
function locHoverFrom(el){
  if(!el || !el.closest) return false;
  const kr = el.closest('tr[data-dvk]'); if(kr){ locHover(kr.dataset.dvk, 'k:' + kr.dataset.k); return true; }
  const cd = el.closest('tr[data-cdp][data-cd]'); if(cd && cd.dataset.f){ locHover(cd.dataset.cdp, 'f:' + cd.dataset.f); return true; }
  const ev = el.closest('article.ev[data-evk][data-evp]'); if(ev){ locHover(ev.dataset.evp, 'k:' + ev.dataset.evk); return true; }
  return false;
}
document.addEventListener('pointerover', e => { if(!locHoverFrom(e.target) && HOV.p && !(e.target.closest && e.target.closest('.hm'))) locHover(null, null); });
document.addEventListener('focusin', e => { if(!locHoverFrom(e.target) && HOV.p) locHover(null, null); });
$('#lbImg').addEventListener('load', lbFit);
addEventListener('resize', () => { if(!$('#lb').hidden) lbFit(); });
addEventListener('scroll', () => { if(!tip.hidden) tip.hidden = true; }, {passive: true});
/* live clocks for the progress screen */
setInterval(() => { if(S.screen === 'progress' && S.prog && !TERMINAL.has(S.prog.state)) scheduleProg(false); }, 1000);
addEventListener('hashchange', () => { const h = readHash(); if(!h.screen) return; if(h.screen === S.screen && (!h.id || h.id === (h.screen === 'results' ? S.res.runId : h.screen === 'progress' ? S.prog && S.prog.runId : S.single.runId))) return; routeTo(h); });
function routeTo(h){
  if(h.screen === 'results' && h.id){ openResults(h.id); return; }
  if(h.screen === 'progress' && h.id){ openProgress(h.id, h.sub === 'run' ? {view: 'run'} : {}); return; }
  if(h.screen === 'single' && h.id){ openSingleRun(h.id); return; }
  go(h.screen || 'single');
}

/* ---------- init ---------- */
(async function init(){
  applyThemeLabels(); applyTextLabels();
  { const d = $('#tModelsBox');                        // 구성 모델 줄은 기본 접힘 — 펼친 상태만 기억한다
    try{ d.open = localStorage.getItem('console-models') === 'open'; }catch(e){}
    d.addEventListener('toggle', () => { try{ localStorage.setItem('console-models', d.open ? 'open' : ''); }catch(e){} }); }
  try{ const m = localStorage.getItem('console-bmode'); if(m === 'list' || m === 'folder') S.batch.mode = m; }catch(e){}
  fRestore();
  $('#fb').addEventListener('click', e => { if(e.target.id === 'fb') fbClose(); });
  S.single.steps = stepsInit();
  const h = readHash();
  go(h.screen || 'single', {noHash: true});
  const st = await loadStatus();
  if(h.id) routeTo(h);
  else if(S.screen === 'batch'){ renderBatch(); refreshEstimate(); }
  else if(S.screen === 'progress') enterProgress();
  else if(S.screen === 'history') renderHistory();
  else if(S.screen === 'single'){ if(st && st.active && st.active.single) openSingleRun(st.active.single); else renderSingle(); }
  statusTimer = setInterval(loadStatus, 30000);
})();
</script>
