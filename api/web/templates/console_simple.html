<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>공유저작물 속성정보 추출 및 검증 시스템 {{ version or 'v1.0' }}</title>
<script>try{var t=localStorage.getItem('console-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
{% raw %}
<style>
/* 간소화 시험 콘솔 — 시안 1 (콘솔 간소화). 화면 3개: 시험 · 진행 · 결과·지표. 어둡게/밝게 전환. */
:root{--f-sans:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;--f-mono:"D2Coding","Consolas","JetBrains Mono","NanumGothicCoding",ui-monospace,monospace;--r:6px;--r2:8px}
:root[data-theme=dark]{--bg:#0a0d10;--pane:#11151a;--pane2:#171c22;--th:#141a20;--line:#252d36;--line2:#323c47;--ink:#d3dae1;--ink2:#a3adba;--mut:#848f9d;--acc:#f5a524;--onacc:#0a0d10;--accs:rgba(245,165,36,.13);--acci:#f5b54a;--ok:#3ccf7a;--oks:rgba(60,207,122,.12);--err:#ff6b6b;--errs:rgba(255,107,107,.12);--warn:#ffd24a;--warns:rgba(255,210,74,.12);--info:#7ea6ff;--infos:rgba(126,166,255,.13);--focus:#7ea6ff;--inbg:#0d1115;--track:#1a2027;--logbg:#0c1014;--shade:rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme=light]{--bg:#f3f4f6;--pane:#fff;--pane2:#f5f6f8;--th:#eef0f3;--line:#d8dde3;--line2:#c3cbd4;--ink:#10151a;--ink2:#3e4853;--mut:#5d6874;--acc:#b86d00;--onacc:#fff;--accs:rgba(184,109,0,.1);--acci:#8a5200;--ok:#1d8048;--oks:rgba(29,128,72,.1);--err:#c22525;--errs:rgba(194,37,37,.09);--warn:#7d5c00;--warns:rgba(125,92,0,.1);--info:#2456b0;--infos:rgba(36,86,176,.09);--focus:#2f6fdb;--inbg:#fff;--track:#e5e8ec;--logbg:#fafbfc;--shade:rgba(16,21,26,.3);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:13.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.okc{color:var(--ok)}.errc{color:var(--err)}.warnc{color:var(--warn)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--pane2);color:var(--ink);border-radius:var(--r);padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:13px;text-decoration:none}
.btn:hover:not([disabled]){border-color:var(--acc)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
.btn.big{padding:11px 26px;font-size:15px}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{border-color:var(--err);color:var(--err)}
/* 상단 */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:22px;padding:0 18px;height:52px;border-bottom:1px solid var(--line);background:var(--pane)}
.sys{font-weight:700;white-space:nowrap}.sys .v{font-family:var(--f-mono);color:var(--acc);margin-left:6px}
.nav{display:flex;gap:2px;height:100%}
.nav button{border:0;background:none;padding:0 16px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;font-size:14px;white-space:nowrap}
.nav button[aria-current=page]{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
.nav .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:1px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3}}
.lights{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink2);font-family:var(--f-mono);white-space:nowrap}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:5px;vertical-align:1px}
.led.ok{background:var(--ok)}.led.err{background:var(--err)}.led.run{background:var(--acc)}
.body{padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px;max-width:1720px;margin:0 auto}
.scr{display:flex;flex-direction:column;gap:14px}
/* 판 */
.pane{background:var(--pane);border:1px solid var(--line);border-radius:var(--r2);min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph .t{font-weight:700;font-size:14px}.ph .r{margin-left:auto;font-size:12px;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pb{padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line2);background:var(--pane2);color:var(--ink2);white-space:nowrap}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
.msg{margin:6px 0 0;font-size:12.5px}.msg.err{color:var(--err)}.msg.warn{color:var(--warn)}
.role{font-size:12px;padding:2px 8px;border-radius:5px;display:inline-block}
.role.use{background:var(--accs);color:var(--acci)}.role.skip{background:var(--pane2);color:var(--mut);border:1px dashed var(--line2)}
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);background:var(--th);padding:6px 9px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
table.t td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.t td.nw{white-space:nowrap}
table.t tr.tot td{font-weight:700;background:var(--pane2)}
table.t tr.dim td{color:var(--mut)}
.ell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:36px 14px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink2);margin-bottom:4px}
/* 시험 화면 */
.ttabs{display:flex;gap:8px}
.ttab{flex:1;text-align:left;border:1px solid var(--line);background:var(--pane);border-radius:var(--r2);padding:10px 14px;cursor:pointer}
.ttab .c{font-family:var(--f-mono);color:var(--acc);font-weight:700;margin-right:8px}
.ttab small{display:block;color:var(--mut);font-size:12px}
.ttab[aria-selected=true]{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr) auto auto 230px;gap:8px;align-items:center;padding:7px 0}
.prow+.prow{border-top:1px dashed var(--line)}
.plab{font-weight:600}.plab small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.pin{width:100%;padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--inbg);color:var(--ink);font-size:12.5px;font-family:var(--f-mono)}
.pstat{font-size:12px;min-width:0}
.prev3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.prev3 .tw{height:320px}
.prev3 .ell{max-width:200px}
.runbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;background:var(--pane2);border-radius:var(--r2)}
/* 진행 */
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--err)}
.runsum{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:14px;align-items:center}
.runsum .k{font-size:12px;color:var(--mut)}.runsum .v{font-family:var(--f-mono);font-size:16px;font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px}
.split .tw,.split .log{height:470px}
.log{font-family:var(--f-mono);font-size:12px;line-height:1.55;overflow:auto;padding:8px 12px;background:var(--logbg);border-radius:0 0 var(--r2) var(--r2)}
.log .ln{white-space:pre-wrap;overflow-wrap:anywhere}
.log .ts{color:var(--mut)}.log .lvb{font-weight:700;color:var(--ok)}.log .L-WARNING .lvb{color:var(--warn)}.log .L-ERROR .lvb,.log .L-CRITICAL .lvb{color:var(--err)}
.log .L-ERROR .m,.log .L-CRITICAL .m{color:var(--err)}
.log .cb{color:var(--mut)}.log .id{color:var(--acc)}.log .cont{padding-left:24px;color:var(--mut)}
.st{font-size:12px;padding:1px 8px;border-radius:9px;white-space:nowrap;display:inline-block}
.st.ok{background:var(--oks);color:var(--ok)}.st.run{background:var(--accs);color:var(--acci)}.st.wait{background:var(--pane2);color:var(--mut)}.st.bad{background:var(--errs);color:var(--err)}
.done-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:18px 20px;border:2px solid var(--ok);border-radius:var(--r2);background:var(--oks)}
.done-card.bad{border-color:var(--err);background:var(--errs)}
.done-card h3{margin:0;font-size:18px;color:var(--ok)}.done-card.bad h3{color:var(--err)}
.done-card p{margin:3px 0 0;color:var(--ink2)}
/* 결과 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;background:var(--pane2)}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:22px;font-weight:700;font-family:var(--f-mono);font-variant-numeric:tabular-nums}.kpi .s{font-size:11.5px;color:var(--mut)}
.kpi.good{border-color:var(--ok)}.kpi.good .v{color:var(--ok)}.kpi.bad{border-color:var(--err)}.kpi.bad .v{color:var(--err)}
.runsel{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);font-weight:600}
.runsel select,.filters select{padding:4px 8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--inbg);color:var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:400;max-width:520px}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;padding:8px 14px;border-bottom:1px solid var(--line)}
.filters input[type=search]{padding:4px 8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--inbg);width:170px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-left:auto}
.grid-v{border-collapse:collapse;font-size:12px;width:100%}
.grid-v th,.grid-v td{border-bottom:1px solid var(--line);padding:4px 6px;white-space:nowrap}
.grid-v th{background:var(--th);color:var(--ink2);font-weight:600;position:sticky;top:0;z-index:1;text-align:left}
.grid-v td.m,.grid-v th.m{text-align:center;width:24px;padding:4px 2px;font-family:var(--f-mono)}
.grid-v th.m small{display:block;font-family:var(--f-sans);font-weight:400;font-size:10.5px;color:var(--mut)}
.vm{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:4px;font-size:11px;font-weight:700;text-align:center}
.vm.ok{background:var(--oks);color:var(--ok)}.vm.err{background:var(--errs);color:var(--err)}.vm.fn{background:var(--warns);color:var(--warn)}.vm.fp{background:var(--infos);color:var(--info)}.vm.warn{background:var(--warns);color:var(--warn)}.vm.na{color:var(--mut)}
.gridwrap{max-height:620px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:8px 14px;font-size:12.5px;color:var(--ink2)}
.files{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* 창 · 알림 */
.modal-bk{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:40}
.modal{width:640px;max-width:94vw;background:var(--pane);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:86vh}
.modal .pb{overflow:auto}
.fl{font-family:var(--f-mono);font-size:12.5px}
.fl button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--ink)}
.fl button:hover{background:var(--accs)}
.fl .sec{font-family:var(--f-sans);font-size:11.5px;color:var(--mut);margin:8px 0 2px}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:80vw}
#toast.err{background:var(--err);color:#fff}
@media (max-width:1150px){.prev3,.split{grid-template-columns:1fr}.runsum{grid-template-columns:1fr 1fr}.prow{grid-template-columns:120px minmax(0,1fr) auto auto}.prow .pstat{grid-column:1/-1}}
</style>
{% endraw %}
</head>
<body>
<header class="top">
  <span class="sys">공유저작물 속성정보 추출 및 검증 시스템<span class="v">{{ version or 'v1.0' }}</span></span>
  <nav class="nav" aria-label="화면" id="nav">
    <button type="button" data-act="go" data-v="test" aria-current="page">시험</button>
    <button type="button" data-act="go" data-v="progress">진행<span class="dot" id="navDot" hidden></span></button>
    <button type="button" data-act="go" data-v="results">결과·지표</button>
  </nav>
  <span class="lights" id="lights"></span>
  <button type="button" class="btn sm" id="themeBtn" data-act="theme"></button>
  {% if not open_mode %}<a class="btn sm" href="/console/logout">로그아웃</a>{% endif %}
</header>
<main class="body">
  <section class="scr" id="scr-test" aria-label="시험"></section>
  <section class="scr" id="scr-progress" aria-label="진행" hidden></section>
  <section class="scr" id="scr-results" aria-label="결과·지표" hidden></section>
</main>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
{% raw %}
<script>
'use strict';
/* ====================================================================
   간소화 시험 콘솔 — 시험 절차서(Te-1 · Te-2)대로 한 시험씩.
   API 는 전체 콘솔과 같다: /api/test/* (folder/peek · folder/scan · folder/start · runs/*).
   ==================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const enc = encodeURIComponent;
const KEYS = [
  [1,'work_title','저작물명','T-001'],[2,'file_name','파일명','T-001'],[3,'work_type','저작물유형','T-001'],[4,'creator','저작자','T-001'],[5,'copyright_holder','저작권자','T-001'],
  [6,'reproduction_right','복제권','T-001'],[7,'performance_right','공연권','T-001'],[8,'public_transmission_right','공중송신권','T-001'],[9,'exhibition_right','전시권','T-001'],
  [10,'distribution_right','배포권','T-001'],[11,'rental_right','대여권','T-001'],[12,'derivative_work_right','2차적저작물작성권','T-001'],[13,'other_rights','기타 권리','T-001'],
  [14,'license_start_date','이용허락 시작일','T-001'],[15,'license_end_date','이용허락 종료일','T-001'],[16,'contract_validity_period','계약 유효기간','T-001'],
  [17,'keywords','키워드','T-002'],[18,'hashtags','해시태그','T-002'],[19,'file_format','파일포맷','T-002'],[20,'file_size','파일크기','T-002'],
  [21,'resolution','해상도','T-002'],[22,'description','설명','T-002'],[23,'file_hash','Hash 데이터','T-002']
].map(([no, key, label, test]) => ({no, key, label, test}));
const SHORT = {work_title:'제목',file_name:'파일명',work_type:'유형',creator:'저작자',copyright_holder:'권리자',reproduction_right:'복제',performance_right:'공연',public_transmission_right:'공중송신',exhibition_right:'전시',distribution_right:'배포',rental_right:'대여',derivative_work_right:'2차적',other_rights:'기타',license_start_date:'시작일',license_end_date:'종료일',contract_validity_period:'유효기간',keywords:'키워드',hashtags:'해시태그',file_format:'포맷',file_size:'크기',resolution:'해상도',description:'설명',file_hash:'해시'};
// 시험 이름·순서는 시험 절차서 그대로 (내부 코드 T-001 · T-002)
const TESTS = ['T-001', 'T-002'];
const TN = t => ({'T-001': 'Te-1', 'T-002': 'Te-2'})[t] || t || '';
const TFULL = {'T-001': '공유저작물 속성정보 정확도', 'T-002': '멀티모달 저작물 속성정보 정확도'};
// 채점 항목 = 평가기와 같은 범위 — 최종 절차서: Te-1 은 1~16번, Te-2 는 1~23번 (기타 권리는 정답이 없어 제외)
const scopeKeys = test => test === 'T-002' ? KEYS.slice() : KEYS.filter(K => K.test === 'T-001');
const scopeTxt = test => { const k = scopeKeys(test); return `${k[0].no}~${k[k.length - 1].no}번 항목`; };
const INPUT = {'T-001': '계약서', 'T-002': '저작물'};
const SRC = {contract: {label: '계약서 폴더', short: '계약서', kind: 'dir'}, work: {label: '저작물 폴더', short: '저작물', kind: 'dir'}, answers: {label: '정답 파일', short: '정답', kind: 'file'}};
const KINDS = ['contract', 'work', 'answers'];
const MEDIA_KO = {text: '어문', image: '이미지', video: '영상'};
const STATE_KO = {queued: '대기', running: '진행 중', scoring: '채점 중', done: '완료', cancelled: '취소됨', error: '오류', interrupted: '중단됨'};
const TERMINAL = new Set(['done', 'cancelled', 'error', 'interrupted']);
const VM = {TP: ['✓', '일치', 'ok'], EMPTY_OK: ['✓', '빈 값 일치', 'ok'], PARTIAL: ['◐', '부분 일치', 'warn'], WRONG: ['✕', '오답 (FP+FN)', 'err'],
  FP: ['+', '과잉 예측 (FP)', 'fp'], FN: ['−', '누락 (FN)', 'fn'], NA: ['·', '해당 없음', 'na']};
const COMPS = ['시스템','업로드','문맥','OCR','LLM','NER','통합','VLM','API','측정','채점'];
const ICON_DL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
const svgI = d => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px">${d}</svg>`;
const ICON_DIR = svgI('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>');
const ICON_FILE = svgI('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>');
const RUNLOG_CAP = 3000, PAGE = 50, SCAN_TTL_MS = 25 * 60 * 1000, LS_PATHS = 'simple-console-paths';

/* ---------- 표시 ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = x => typeof x === 'number' && isFinite(x);
const pct = (x, d) => isNum(x) ? (x * 100).toFixed(d == null ? 1 : d) + '%' : '—';
const nf = n => isNum(n) ? Math.round(n).toLocaleString('ko-KR') : '—';
const won = x => isNum(x) ? '₩' + (x >= 100 ? Math.round(x).toLocaleString('ko-KR') : x.toLocaleString('ko-KR', {maximumFractionDigits: 1})) : '—';
const secs = x => isNum(x) ? (x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('ko-KR')) + '초' : '—';
const dur = s => { if(!isNum(s) || s < 0) return '—'; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}시간 ${m}분` : m ? `${m}분 ${x}초` : `${x}초`; };
const size = b => !isNum(b) ? '—' : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function toMs(t){ if(t == null || t === '') return null; if(typeof t === 'number') return t < 1e12 ? t * 1000 : t; const v = Date.parse(/^\d{4}-\d\d-\d\d \d/.test(String(t)) ? String(t).replace(' ', 'T') : String(t)); return isNaN(v) ? null : v; }
function fmtWhen(t){ const ms = toMs(t); if(ms == null) return '—'; const d = new Date(ms), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
const fv = (o, ...ks) => { for(const k of ks){ if(o && o[k] != null) return o[k]; } return null; };
const baseName = p => String(p || '').split(/[\\/]/).pop();
// 로그에서는 경로를 빼고 파일 이름만 보인다
function scrub(s){ return String(s == null ? '' : s).replace(/(?<=^|[\s=(:'"])(?:[A-Za-z]:)?(?:[^\s\\/·,'"()]*[\\/]){2,}([^\s\\/·,'"()]+)/g, '$1').replace(/프레임 v\d+\b/g, '프레임 표준').replace(/frame_schedule=v\d+/g, 'frame_schedule=표준'); }

/* ---------- 로그 줄 (서버 형식 `HH:MM:SS LEVEL [세트] [구성요소] 메시지`) ---------- */
const normLv = x => { const s = String(x || '').toUpperCase(); return s === 'WARN' ? 'WARNING' : s === 'FATAL' ? 'CRITICAL' : s; };
const LV_RANK = {DEBUG: 10, INFO: 20, WARNING: 30, ERROR: 40, CRITICAL: 50};
const lvRank = lv => LV_RANK[lv] || 20;
function hms(t){ if(typeof t === 'string'){ const m = t.match(/(\d\d:\d\d:\d\d)/); if(m) return m[1]; } const ms = toMs(t); if(ms == null) return ''; const d = new Date(ms), p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
const LOG_RX = /^(?:(\d{4}-\d\d-\d\d)[ T])?(\d\d:\d\d:\d\d)(?:[,.]\d+)?\s+(DEBUG|INFO|WARNING|WARN|ERROR|CRITICAL|FATAL)\s+([\s\S]*)$/;
function parseLog(raw, ev){
  const o = {raw: String(raw == null ? '' : raw), ts: '', lv: '', comp: '', set: '', msg: '', cont: false};
  let rest = o.raw;
  const m = rest.match(LOG_RX);
  if(m){ o.ts = m[2]; o.lv = normLv(m[3]); rest = m[4]; }
  const ec = ev && ev.component && ev.component !== '-' ? String(ev.component) : '';
  let b = rest.match(/^\[([^\]\s]{1,40})\][ \t]*/);
  if(b && !COMPS.includes(b[1]) && b[1] !== ec){ o.set = b[1]; rest = rest.slice(b[0].length); b = rest.match(/^\[([^\]\s]{1,16})\][ \t]*/); }
  if(b && (COMPS.includes(b[1]) || (ec && b[1] === ec))){ o.comp = b[1]; rest = rest.slice(b[0].length); }
  o.msg = rest;
  if(ev){ if(ev.level) o.lv = normLv(ev.level); if(ec) o.comp = ec; if(ev.set_id != null && ev.set_id !== '') o.set = String(ev.set_id); if(!o.ts && ev.ts != null) o.ts = hms(ev.ts); }
  if(o.set === '-') o.set = '';
  o.cont = !m && !(ev && ev.level);
  o.text = o.comp === 'API' ? o.msg : scrub(o.msg);
  return o;
}
function inheritLog(o, prev){ if(o.cont && prev){ o.lv = o.lv || prev.lv; o.set = o.set || prev.set; o.comp = o.comp || prev.comp; } if(!o.lv) o.lv = 'INFO'; return o; }
function logLineHTML(o){
  const lv = o.lv || 'INFO', msg = esc(o.text != null ? o.text : o.msg);
  if(o.cont) return `<div class="ln cont L-${lv}">${msg}</div>`;
  return `<div class="ln L-${lv}"><span class="ts">${esc(o.ts || '--:--:--')}</span> <span class="lvb">${lv === 'WARNING' ? 'WARN' : lv === 'CRITICAL' ? 'CRIT' : lv}</span> ${o.set ? `<span class="id">[${esc(o.set)}]</span> ` : ''}${o.comp ? `<span class="cb">[${esc(o.comp)}]</span> ` : ''}<span class="m">${msg}</span></div>`;
}

/* ---------- API ---------- */
class ApiError extends Error{ constructor(status, data, msg){ super(msg); this.status = status; this.data = data; } }
function errText(status, data){
  const code = data && (data.error || data.code);
  if(status === 0) return '서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인하세요.';
  if(status === 409 || code === 'busy') return '다른 시험이 진행 중입니다. 진행 화면에서 확인하세요.';
  let m = data && (data.message || data.detail || data.error);
  if(m && typeof m === 'object') m = JSON.stringify(m);
  if(status === 401) return '로그인이 필요합니다.';
  if(status === 404) return m && m !== 'not_found' ? m : '찾을 수 없습니다.';
  if(status >= 500) return '서버 오류가 발생했습니다' + (m ? ' — ' + m : '') + '.';
  return m || `요청이 실패했습니다 (HTTP ${status}).`;
}
async function api(path, opt){
  opt = opt || {};
  const o = {credentials: 'same-origin', headers: {Accept: 'application/json'}, method: opt.method || 'GET'};
  if(opt.json !== undefined){ o.method = opt.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opt.json); }
  let r;
  try{ r = await fetch('/api/test' + path, o); }catch(e){ throw new ApiError(0, null, errText(0, null)); }
  let data = null; const txt = await r.text();
  if(txt){ try{ data = JSON.parse(txt); }catch(e){ data = {message: txt.slice(0, 300)}; } }
  if(r.status === 401){ location.href = '/console/login?next=/test'; }
  if(!r.ok) throw new ApiError(r.status, data, errText(r.status, data));
  return data;
}
async function apiText(path){
  const r = await fetch('/api/test' + path, {credentials: 'same-origin'});
  if(!r.ok) throw new ApiError(r.status, null, errText(r.status, null));
  return r.text();
}

/* 실행 이벤트 (SSE, ?after=seq 로 이어 받기) */
class RunStream{
  constructor(runId, onEvent, onEnd){ this.runId = runId; this.seq = 0; this.onEvent = onEvent; this.onEnd = onEnd; this.closed = false; this.fails = 0; this.open(); }
  open(){
    if(this.closed) return;
    const es = new EventSource('/api/test' + runPath(this.runId) + '/stream?after=' + this.seq);
    this.es = es;
    es.onopen = () => { this.fails = 0; };
    es.onmessage = e => {
      let ev; try{ ev = JSON.parse(e.data); }catch(_){ return; }
      if(isNum(ev.seq)){ if(ev.seq <= this.seq && ev.type !== 'closed') return; this.seq = ev.seq; }
      try{ this.onEvent(ev); }catch(err){ console.warn('event', err); }
      if(ev.type === 'closed') this.finish(ev);
    };
    es.onerror = () => { es.close(); if(this.closed) return; this.fails++; setTimeout(() => this.check(), Math.min(10000, 800 * Math.pow(1.7, this.fails))); };
  }
  async check(){
    if(this.closed) return;
    try{ const run = await api(runPath(this.runId)); if(TERMINAL.has(run.state) && this.fails >= 2){ this.finish({type: 'closed', state: run.state}); return; } this.open(); }
    catch(e){ if(e.status === 404){ this.finish({type: 'closed', state: 'missing'}); return; } setTimeout(() => this.check(), 3000); }
  }
  finish(ev){ if(this.closed) return; this.closed = true; if(this.es) this.es.close(); if(this.onEnd) this.onEnd(ev); }
  close(){ this.closed = true; if(this.es) this.es.close(); }
}

function setPath(t, k, v){

/* ======================================================================
   2 · 진행 — 지금 실행의 세트 · 실행 로그 (실시간)
   ====================================================================== */
function newProg(runId){ return {runId, run: null, rows: new Map(), order: [], log: [], total: 0, done: 0, failed: 0, cost: 0, state: null, startedMs: null, finishedMs: null, stream: null, follow: true, filter: 'all', warnOnly: false, err: null, rem: null, nErr: 0, nWarn: 0, seqN: 0}; }
function applyRun(P, run){
  P.run = run; P.state = run.state;
  const pr = run.progress || {};
  if(isNum(pr.total)) P.total = pr.total; else if(isNum(run.n_sets)) P.total = run.n_sets;
  if(isNum(pr.i)) P.done = Math.max(P.done, pr.i);
  if(isNum(pr.failed)) P.failed = pr.failed;
  if(isNum(pr.cost_krw_total)) P.cost = pr.cost_krw_total; else if(isNum(run.cost_krw)) P.cost = run.cost_krw;
  P.startedMs = toMs(run.started_at) || toMs(run.created_at); P.finishedMs = toMs(run.finished_at);
  P.rem = run.remaining || null;
  if(run.error) P.err = scrub(run.error);
}
async function openProgress(runId){
  if(S.prog && S.prog.runId === runId) return;
  if(S.prog && S.prog.stream) S.prog.stream.close();
  const P = newProg(runId); S.prog = P;
  try{ applyRun(P, await api(runPath(runId))); }catch(e){ P.err = e.message; }
  if(S.prog !== P) return;
  await loadSetList(P);
  if(TERMINAL.has(P.state)) await loadLog(P);
  else if(S.prog === P) P.stream = new RunStream(runId, ev => onProgEvent(P, ev), ev => progClosed(P, ev));
  if(S.screen === 'progress') renderProgress(true);
}
async function enterProgress(){
  if(!S.prog){
    const act = activeRuns();

    if(!id){ try{ const runs = await loadRuns(); const r = runs.find(x => x.kind === 'batch'); id = r ? r.run_id : null; }catch(e){} }
    if(id){ await openProgress(id); return; }

async function loadSetList(P){
  try{
    const r = await api(runPath(P.runId) + '/sets?limit=5000'); if(S.prog !== P) return;
    (r.items || []).forEach(it => {
      const ex = P.rows.get(it.set_id);
      if(ex){ ex.file = it.file_name; if(!ex.title) ex.title = it.title; if(!ex.media) ex.media = it.media; return; }
      P.rows.set(it.set_id, {id: it.set_id, media: it.media, title: it.title, file: it.file_name, st: it.state === 'pending' ? 'wait' : (it.ok === false ? 'bad' : 'ok'), el: it.elapsed_sec, err: it.error});
      P.order.push(it.set_id);
    });
  }catch(e){}
}
async function loadLog(P){
  try{ const t = await apiText(runPath(P.runId) + '/download/test.log'); if(S.prog !== P) return; t.split(/\r?\n/).filter(Boolean).forEach(l => pushLog(P, l, null)); }catch(e){}
}
function rowFor(P, id){ let r = P.rows.get(id); if(!r){ r = {id, st: 'run', t0: Date.now()}; P.rows.set(id, r); P.order.push(id); } return r; }
function pushLog(P, raw, ev){
  const o = inheritLog(parseLog(raw, ev), P.log[P.log.length - 1]);
  if(!o.cont){ if(lvRank(o.lv) >= 40) P.nErr++; else if(o.lv === 'WARNING') P.nWarn++; }
  P.log.push(o); if(P.log.length > RUNLOG_CAP) P.log.splice(0, P.log.length - RUNLOG_CAP);
  return o;
}
function logToRows(P, o){
  if(!o || o.cont || !o.set) return;
  let m = (o.msg || '').match(/^시작 —(.*)$/);
  if(m){ const r = rowFor(P, o.set); if(!r.t0) r.t0 = Date.now(); const md = m[1].match(/media=(\w+)/); if(md && !r.media) r.media = md[1]; return; }
  m = (o.msg || '').match(/^종료 — (OK|FAIL) · ([\d.]+)s(?:.*?₩([\d.]+))?(?: · (.*))?/);
  if(m){ const r = rowFor(P, o.set); if(r.st === 'run') r.st = m[1] === 'OK' ? 'ok' : 'bad'; if(!isNum(r.el)) r.el = +m[2]; if(m[1] === 'FAIL' && !r.err) r.err = m[4] || '실패'; }
}
function onProgEvent(P, ev){
  const t = ev.type;
  if(t === 'start'){ if(isNum(ev.total)) P.total = ev.total; }
  else if(t === 'set_start'){ const r = rowFor(P, ev.set_id); Object.assign(r, {st: 'run', t0: toMs(ev.ts) || Date.now()}); ['media', 'title'].forEach(k => { if(ev[k] != null) r[k] = ev[k]; }); }
  else if(t === 'set_done'){ const r = rowFor(P, ev.set_id); r.st = ev.ok === false ? 'bad' : 'ok'; r.doneSeq = ++P.seqN; r.el = ev.elapsed_sec; r.err = ev.error; ['media', 'title'].forEach(k => { if(ev[k] != null) r[k] = ev[k]; }); }
  else if(t === 'progress'){ if(isNum(ev.i)) P.done = Math.max(P.done, ev.i); if(isNum(ev.total)) P.total = ev.total; if(isNum(ev.failed)) P.failed = ev.failed; if(isNum(ev.cost_krw_total)) P.cost = ev.cost_krw_total;
    if(ev.set_id){ const r = rowFor(P, ev.set_id); if(r.st === 'run' || r.st === 'wait'){ r.st = ev.ok === false ? 'bad' : 'ok'; r.doneSeq = ++P.seqN; if(isNum(ev.elapsed_sec)) r.el = ev.elapsed_sec; if(ev.error) r.err = ev.error; } } }
  else if(t === 'log'){ const line = fv(ev, 'line', 'text', 'message', 'msg'); if(line != null){ const o = pushLog(P, line, ev); logToRows(P, o); appendLog(P, o); } }
  else if(t === 'state'){ P.state = ev.state; if(ev.state === 'running' && !P.startedMs) P.startedMs = toMs(ev.ts) || Date.now(); if(ev.error) P.err = scrub(ev.error); }
  else if(t === 'error'){ P.err = scrub(ev.error || ev.message || '오류'); }
  else if(t === 'cost_limit'){ P.err = `비용 상한에 도달해 멈췄습니다 (${won(ev.cost_krw)} / 상한 ${won(ev.limit)})`; }
  scheduleProg();
}
async function progClosed(P, ev){

  P.rows.forEach(r => { if(r.st === 'run') r.st = P.state === 'done' ? 'ok' : 'wait'; });
  await loadStatus();
  if(S.screen === 'progress') renderProgress(true);
  if(P.state === 'done') toast('추출 및 검증이 끝났습니다' + (P.run && isNum(P.run.macro_f1) ? ` · Macro F1 ${pct(P.run.macro_f1)}` : ''));
  else if(P.state === 'cancelled') toast('실행이 취소되었습니다. 끝난 세트의 결과는 남아 있습니다');
  else if(P.state === 'error') toast('실행이 오류로 끝났습니다' + (P.err ? ' — ' + P.err : ''), true);

let progT = null;
function scheduleProg(){ if(progT) return; progT = setTimeout(() => { progT = null; if(S.screen === 'progress') renderProgress(false); }, 250); }
function progNums(P){
  const term = TERMINAL.has(P.state), tot = P.total, done = P.done;
  const el = P.startedMs ? ((P.finishedMs || (term ? null : Date.now())) - P.startedMs) / 1000 : null;
  const frac = tot ? Math.min(1, done / tot) : 0, eta = tot && done && el && !term ? el / done * (tot - done) : null;
  return {term, tot, done, el: isNum(el) && el >= 0 ? el : null, frac, eta};
}

async function loadRuns(){ const runs = await api('/runs'); S.res.runs = runs; return runs; }
const resultRuns = () => (S.res.runs || []).filter(r => r.kind === 'batch' && TESTS.includes(r.test) && (r.macro_f1 != null || r.state === 'done'));
async function enterResults(){
  const R = S.res;
  try{ await loadRuns(); }catch(e){ R.err = e.message; }
  const list = resultRuns();
  if(!R.runId || !list.some(r => r.run_id === R.runId)) R.runId = list.length ? list[0].run_id : null;
  if(R.runId) await openResults(R.runId); else renderResults();
}
async function openResults(runId){
  const R = S.res;
  if(R.runId !== runId){ R.onlyBad = false; R.failed = false; R.q = ''; }
  R.runId = runId; R.run = null; R.metrics = null; R.mErr = null; R.items = []; R.total = 0; R.offset = 0; R.loading = true;
  if(S.screen !== 'results'){ go('results'); return; }
  renderResults();
  // 응답은 지금 고른 실행의 것만 쓴다 (먼저 고른 실행의 늦은 응답이 덮어쓰지 않게)
  let run = null, metrics = null, mErr = null;
  try{ run = await api(runPath(runId)); }catch(e){ mErr = e.message; }
  try{ metrics = await api(runPath(runId) + '/metrics'); }catch(e){ mErr = e.status === 404 ? 'notyet' : e.message; }
  if(R.runId !== runId) return;
  R.run = run; R.metrics = metrics; R.mErr = mErr;
  R.loading = false; renderResults(); loadSets();
}
function resultKeys(){
  const R = S.res, m = R.metrics, test = (m && m.test) || (R.run && R.run.test) || 'T-002';
  if(!m || !m.keys) return scopeKeys(test);
  const ex = (m.excluded_keys || []).map(x => x.key || x);
  return KEYS.filter(K => m.keys[K.key] || ex.includes(K.key));
}
async function loadSets(){
  const R = S.res, id = R.runId; if(!id) return;
  const q = new URLSearchParams({offset: R.offset, limit: PAGE});
  if(R.onlyBad) q.set('verdict', 'WRONG,FP,FN,PARTIAL');
  if(R.failed) q.set('failed', '1');
  if(R.q.trim()) q.set('q', R.q.trim());
  try{ const r = await api(runPath(id) + '/sets?' + q); if(R.runId !== id) return; R.items = r.items || []; R.total = r.total || 0; R.setsErr = null; }

}
function runOption(r){
  const t = r.test, ok = r.macro_f1 != null ? (r.passed ? '만족' : '미달') : (STATE_KO[r.state] || r.state);
  return `${fmtWhen(r.created_at)} · ${TN(t)} · ${nf(r.n_sets)}세트${r.macro_f1 != null ? ' · Macro ' + pct(r.macro_f1) : ''} · ${ok}${r.name ? ' · ' + r.name : ''}`;

function prfTableHTML(m, ks){

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v, k = b.dataset.k;
  if(a === 'fb-close' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  if(b.disabled) return;
  if(b.tagName === 'A' && a === 'go') e.preventDefault();
  if(a === 'go') go(v);
  else if(a === 'theme') toggleTheme();
  else if(a === 'test'){ S.test = v; S.startErr = null; renderTest(); maybeScan(v); }
  else if(a === 'load'){ const inp = $('#p-' + k); if(inp) setPath(S.test, k, inp.value); loadPeek(S.test, k); }
  else if(a === 'browse') openBrowser(k);
  else if(a === 'fb-go') fbGo(v, false);
  else if(a === 'fb-close'){ S.fb = null; renderModal(); }
  else if(a === 'fb-pick' || a === 'fb-file'){ const F = S.fb; const path = a === 'fb-file' ? v : F.data.path; S.fb = null; renderModal(); setPath(F.test, F.kind, path); if(S.test === F.test) renderTest(); loadPeek(F.test, F.kind); }
  else if(a === 'start') startRun();
  else if(a === 'cancel'){ const P = S.prog; if(!P || !confirm('실행을 취소할까요? 진행 중인 세트만 마치고 멈춥니다.')) return; try{ await api(runPath(P.runId) + '/cancel', {json: {}}); toast('취소를 요청했습니다 — 진행 중인 세트만 마치고 멈춥니다'); }catch(err){ toast(err.message, true); } }
  else if(a === 'retry'){ const P = S.prog; if(!P) return; try{ await api(runPath(P.runId) + '/retry', {json: {}}); const id = P.runId; S.prog = null; await loadStatus(); await openProgress(id); renderProgress(true); toast('실패·미실행 세트를 다시 실행합니다'); }catch(err){ toast(err.message, true); } }
  else if(a === 'open-results') openResults(v);
  else if(a === 'pg'){ const R = S.res, last = Math.max(0, Math.floor((R.total - 1) / PAGE) * PAGE); R.offset = v === 'first' ? 0 : v === 'prev' ? Math.max(0, R.offset - PAGE) : v === 'next' ? R.offset + PAGE : last; loadSets(); }
  else if(a === 'copy'){ try{ await navigator.clipboard.writeText(v); toast('경로를 복사했습니다'); }catch(err){ toast('복사하지 못했습니다 — 경로를 직접 선택해 복사하세요', true); } }
});
document.addEventListener('change', e => {
  const el = e.target, bd = el.dataset.bind; if(!bd) return;
  if(bd === 'path'){ if(setPath(S.test, el.dataset.k, el.value)) patchRow(S.test, el.dataset.k); }
  else if(bd === 'pfilter' && S.prog){ S.prog.filter = el.value; const rows = $('#pRows'); if(rows){ const x = progRowsHTML(S.prog); rows.innerHTML = x; rows._h = x; rows.scrollTop = 0; } }
  else if(bd === 'pwarn' && S.prog){ S.prog.warnOnly = el.checked; renderProgress(true); }
  else if(bd === 'pfollow' && S.prog){ S.prog.follow = el.checked; if(el.checked){ const lg = $('#pLog'); if(lg) lg.scrollTop = lg.scrollHeight; } }
  else if(bd === 'run') openResults(el.value);
  else if(bd === 'r-bad'){ S.res.onlyBad = el.checked; S.res.offset = 0; loadSets(); }
  else if(bd === 'r-failed'){ S.res.failed = el.checked; S.res.offset = 0; loadSets(); }
});
let qT = null;
document.addEventListener('input', e => {
  if(e.target.dataset.bind === 'path'){ const lb = $('#load-' + e.target.dataset.k); if(lb && !S.peekBusy[pk(S.test, e.target.dataset.k)]) lb.disabled = !e.target.value.trim(); return; }
  if(e.target.dataset.bind !== 'r-q') return; S.res.q = e.target.value; clearTimeout(qT); qT = setTimeout(() => { S.res.offset = 0; loadSets(); }, 300); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && S.fb){ S.fb = null; renderModal(); }
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.bind === 'path'){ const k = e.target.dataset.k; setPath(S.test, k, e.target.value); loadPeek(S.test, k); }
});

/* ---------- 시작 ---------- */
(async function init(){
  themeLabel();
  await loadStatus();
  setInterval(loadStatus, 10000);
  const want = (location.hash || '').slice(1);
  // 경로가 이미 있으면 미리보기를 다시 불러온다 (새로 고침해도 그대로)
  for(const t of TESTS) for(const k of KINDS) if(S.paths[t][k]) loadPeek(t, k);
  if(['test', 'progress', 'results'].includes(want)) go(want);
  else if(activeRuns().length) go('progress');
  else go('test');
})();
</script>
