[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copyright-metadata-extraction"
version = "2.0.0"
description = "Copyright metadata extraction system for Korean documents"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = [".", "api"]
include = ["api*", "module*", "web*"]
exclude = ["*.tests", "kogl-classifier*", "data*", "docs*", "OCR*", "scripts*"]
